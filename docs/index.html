    const src = P.pick(+b.dataset.slot);
    if (src) P.use(src);
  });

  P.open = on => {
    host.hidden = on === undefined ? !host.hidden : !on;
    stackPanels();
  };

  P.use = () => {};              // set by whoever owns this pad
  P.drawSlots();
  P.reset();
  return P;
}

document.getElementById('impObj').onclick = () => document.getElementById('ofile').click();
document.getElementById('ofile').onchange = e => {

};

const dz = document.getElementById('drop');
['dragenter','dragover'].forEach(t => addEventListener(t, e => {
  e.preventDefault(); dz.classList.add('on'); }));
addEventListener('dragleave', e => { if (e.target === dz) dz.classList.remove('on'); });
addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('on');
  importFiles(e.dataTransfer.files);
});


/* ---- the drawing controls ------------------------------------------------
   Colour, erase, draw, line, fill, smooth and size, as one block. It is put
   wherever drawing happens - the toolbar and the shape pad - so the two cannot
   drift apart. Each copy carries its own tool and erase; colour, smooth and
   size are one setting shared between them.

   Wired by delegation rather than by id, because the same markup appears more
   than once and ids may not. */
/* One panel, put up twice: one for drawing shapes to paint with, one for
   drawing the shapes a mask is cut from. They share every line of behaviour
   below and none of their state, so what is drawn on one never appears on the
   other. The mask's has no colour at all - a hole has none. */
function padMarkup(who, white) {
  const id = n => who + '-' + n;
  return '<div class="pad" id="' + id('wrap') + '" hidden>'
    + '<i class="grip" data-drag="' + id('wrap') + '"></i>'
    + '<canvas id="' + id('cv') + '" width="256" height="256"></canvas>'
    + '<div id="' + id('ctl') + '"></div>'
    + '<div class="padrow">'
    +   '<button class="tb ic" id="' + id('clear') + '" data-i="clear"'
    +     ' title="Clear the pad" aria-label="Clear the pad"></button>'
    +   '<button class="tb ic" id="' + id('save') + '" data-i="save"'
    +     ' title="Keep in a slot" aria-label="Keep in a slot"></button>'
    +   '<button class="tb ic" id="' + id('done') + '" data-i="cancel"'
    +     ' title="Close" aria-label="Close"></button>'
    +   (white ? '' : '<button class="tb swb" data-ctl-colour="' + who
    +     '" aria-label="Colour"><i></i></button>')
    + '</div>'
    + '<div class="slots" id="' + id('slots') + '"></div>'
    + '</div>';
}

function controlsMarkup(where) {
  const b = (k, icon, label, on) =>
    '<button class="tb ic" data-ct="' + k + '" data-i="' + icon + '" '
    + 'aria-pressed="' + (on ? 'true' : 'false') + '" title="' + label + '" '
    + 'aria-label="' + label + '"></button>';
  return '<div class="ctl" data-for="' + where + '">'
    + '<div class="row">'
    +   '<div class="seg icons">'
    +     b('brush', 'brush', 'Draw', true) + b('line', 'line', 'Line')
    +     b('fill', 'fill', 'Fill')
    +   '</div>'
    +   b('erase', 'erase', 'Erase')
    + '</div>'
    + '<div class="row"><label class="sl" title="Hold still to smooth">'
    +   '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path'
    +   ' d="M2 12c3 0 3-8 6-8s3 8 6 8" fill="none" stroke="currentColor"'
    +   ' stroke-width="1.4" stroke-linecap="round"/></svg>'
    +   '<input type="range" data-ct="smooth" min="0" max="100" step="5" value="0">'
    +   '<b data-ct="smoothV"></b></label></div>'
    + '<div class="row"><label class="sl" title="Brush size">'
    +   '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path'
    +   ' d="M2.5 11.5a2.5 2.5 0 1 0 0-.1z M9.5 6a4.5 4.5 0 1 0 0-.1z" fill="none"'
    +   ' stroke="currentColor" stroke-width="1.4"/></svg>'
    +   '<input type="range" data-ct="size" min="0" max="100" step="1" value="45">'
    +   '<b data-ct="sizeV"></b></label></div>'
    + '</div>';
}

/* ---- icons -------------------------------------------------------------
   Drawn here rather than written into the markup, so the toolbar stays short
   and every button is the same size. 16x16, stroke only, currentColor. */
const ICONS = {

  move:   'M8 2v12 M2 8h12 M8 2L6 4 M8 2l2 2 M8 14l-2-2 M8 14l2-2 M2 8l2-2 M2 8l2 2 M14 8l-2-2 M14 8l-2 2',

  soft:   'M8 3.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z M8 1.5v1 M8 13.5v1 M1.5 8h1 M13.5 8h1',
  mirror: 'M8 2v12 M6 5L2.5 8 6 11z M10 5l3.5 3L10 11z',

  impObj: 'M8 1.8l5 2.6v6.2L8 13.2 3 10.6V4.4l5-2.6z M3 4.4l5 2.6 5-2.6 M8 7v6.2',
  impTex: 'M2.5 3.5h11v9h-11z M2.5 10l3-3 2.5 2.5L11 6l2.5 2.5 M5.5 6.2a.8.8 0 1 0 0-.1z',
  photo:  'M2.5 4.5h3l1-1.5h3l1 1.5h3v8h-11z M8 6.2a2.6 2.6 0 1 0 0 5.2 2.6 2.6 0 0 0 0-5.2z',
  save:   'M8 2.5v7 M5 6.8L8 9.8l3-3 M2.5 11.5v2h11v-2',
  mask:   'M2.5 2.5h11v11h-11z M5 5.5h6v5H5z',
  invert: 'M8 2.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z M8 2.5v11',
  /* The three ways of taking a mask, all shown as the same circle so they read
     as one idea: drawn by hand, cut by a shape, or turned inside out. */
  maskDraw:   {d: 'M4.2 11.6l.6-2.4 5-5 1.8 1.8-5 5z',
               fill: 'M9.8 4.2l1.8 1.8 1.3-1.3-1.8-1.8z'},
  maskShape:  {fill: 'M8 3.4l1.6 3.3 3.6.5-2.6 2.5.6 3.6L8 11.6 4.8 13.3l.6-3.6'
                   + '-2.6-2.5 3.6-.5z'},
  maskInvert: {fill: 'M8 2.6a5.4 5.4 0 0 0 0 10.8z'},
  done:   'M3 8.5l3.5 3.5L13 4.5',
  cancel: 'M4 4l8 8 M12 4l-8 8',
  copy:   'M5.5 5.5h8v8h-8z M2.5 10.5v-8h8',
  shapes: 'M8 1.6l2 4.4 4.4.4-3.4 3 1.1 4.4L8 11.4 3.9 13.8 5 9.4 1.6 6.4 6 6z',
};
for (const [host, where] of [['barCtl', 'bar'], ['padCtl', 'pad']]) {
  const el = document.getElementById(host);
  if (el) el.innerHTML = controlsMarkup(where);
}

/* One handler for every copy of the controls. Tool and erase belong to the
   copy that was pressed; colour, smooth and size are one setting, so pressing
   either copy moves both. */
/* Gradient is not one of the shared controls: it acts on the garment only, so
   it keeps its own button beside them. */
document.getElementById('gradTool').onclick = () => {
  if (!mesh) return;
  setMode('paint');
  if (grad) { endGradient(); return; }
  ctlState.bar.erase = false;
  ctlSync();
  startGradient();
  document.getElementById('gradTool').setAttribute('aria-pressed', 'true');
};

/* Two instances, and nothing is shared between them. The toolbar's values are
   the garment's; the pad keeps its own. Syncing the two meant changing the
   colour for one changed it for the other, which is not what a separate set of
   controls should do. */

function ctlAll(sel) { return [...document.querySelectorAll(sel)]; }

function ctlSync() {
  for (const c of ctlAll('.ctl [data-ct]')) {
    const host = c.closest('.ctl'), who = host && host.dataset.for;
    if (!who) continue;
    const st = ctlState[who];
    const k = c.dataset.ct;
    if (k === 'brush' || k === 'line' || k === 'fill')
      c.setAttribute('aria-pressed', String(st.tool === k && !st.erase));
    else if (k === 'erase') c.setAttribute('aria-pressed', String(st.erase));

    else if (k === 'smooth') c.value = String(Math.round(st.smooth*100));
    else if (k === 'smoothV') c.textContent = Math.round(st.smooth*100) + '%';
    else if (k === 'size') c.value = String(st.size);
    else if (k === 'sizeV') c.textContent = who === 'bar'
      ? radius.toFixed(1) + ' cm' : Math.round(st.size) + '%';
  }
  /* The garment's settings are read through these; each pad reads its own
     directly, so nothing is copied out for them. */
  tool = ctlState.bar.tool;
  erase = ctlState.bar.erase;
  colour = ctlState.bar.colour;
  flow = ctlState.bar.flow;
  smoothAmt = ctlState.bar.smooth;
  for (const sw of ctlAll('[data-ctl-colour]')) {
    const own = ctlState[sw.dataset.ctlColour];
    if (own && sw.firstElementChild)
      sw.firstElementChild.style.background = toHex(own.colour);
  }
}

let sizeVal = 45;
/* The colour lives beside the other panel buttons rather than in the block, so
   it is wired on its own. */
for (const sw of ctlAll('[data-ctl-colour]'))
  sw.addEventListener('click', e => {
    e.stopPropagation();
    ctlWho = sw.dataset.ctlColour;
    /* Reaching for the colour means you want a colour. With erasing still on,
       the picker went on offering nothing but its strength. */
    ctlState[ctlWho].erase = false;
    ctlSync();
    openPickerFor(sw);
  });

for (const host of ctlAll('.ctl')) {
  host.addEventListener('click', e => {
    const b = e.target.closest('[data-ct]');
    if (!b || b.tagName === 'INPUT') return;
    const who = host.dataset.for, st = ctlState[who], k = b.dataset.ct;
    if (k === 'colour') {
      ctlWho = who;
      openPickerFor(b);
      return;
    }
    if (k === 'erase') {
      st.erase = !st.erase;
      ctlWho = who;
      // Erasing has nothing to choose but how much to take away, so the picker
      // comes up showing only that.
      // Erasing has only its strength to choose, on either set of controls -
      // the pad had no way to reach it at all.
      stopTarget = null;
      pickerFor(st.erase ? 'erase' : 'brush');
      if (st.erase) openPickerFor(b);
    }
    else if (k === 'brush' || k === 'line' || k === 'fill') {
      // choosing a tool leaves erasing, since erasing is not one of them, and
      // the strength panel goes with it
      const wasErasing = st.erase;
      st.tool = k;
      st.erase = false;
      if (wasErasing && pick.getAttribute('data-mode') === 'erase') {
        pick.hidden = true;
        swatch.setAttribute('aria-expanded', 'false');
      }
    }
    else return;
    if (who === 'bar') { setMode('paint'); if (grad) endGradient(); }
    ctlSync();
  });
  host.addEventListener('input', e => {
    const who = host.dataset.for, st = ctlState[who], k = e.target.dataset.ct;
    // into this copy's own state; writing to the globals meant the sync below
    // immediately put them back to whatever the other copy held
    if (k === 'smooth') st.smooth = +e.target.value/100;
    else if (k === 'size') {
      st.size = +e.target.value;
      if (who === 'bar') radius = sliderRadius(st.size);
    }
    else return;
    ctlSync();
  });
}

/* Built after the markup and the icons exist. Each is told what a shape from it
   is for; nothing else about them differs. */
const pads = {paint: makePad('paint', false), mask: makePad('mask', true)};
pads.paint.use = src => startStamp(src);
pads.mask.use = src => startMaskShape(src);
padTick = () => { pads.paint.stroke.tick(); pads.mask.stroke.tick(); };

document.getElementById('padOpen').onclick = () => pads.paint.open();


for (const b of document.querySelectorAll('[data-i]')) {
  const ic = ICONS[b.dataset.i];
  if (!ic) continue;
  // an icon is either a stroked outline or an outline with a solid part
  const d = typeof ic === 'string' ? ic : ic.d;   // may be absent
  const solid = typeof ic === 'string' ? '' : ic.fill;
  /* Every icon is a ring with its mark inside, so the whole set reads as one
     family. The ring is drawn here rather than in each path, and the mark is
     shrunk to sit within it. */
  b.insertAdjacentHTML('afterbegin',
    '<svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true">'
    + '<circle cx="8" cy="8" r="7" fill="none" stroke="currentColor"'
    + ' stroke-width="1.1" opacity="0.5"/>'
    + '<g transform="translate(8,8) scale(0.78) translate(-8,-8)">'
    + (d ? '<path d="' + d + '" fill="none" stroke="currentColor"'
         + ' stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>' : '')
    + (solid ? '<path d="' + solid + '" fill="currentColor"/>' : '')
    + '</g></svg>');
}

setMode('paint');
drawRecent();
applyColour(false);
load(FORMATS.procedural());
refreshUndo();
})();
