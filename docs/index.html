<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>T-shirt paint</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#12181F;
  font:400 13px/1.4 ui-sans-serif,-apple-system,"Helvetica Neue",Arial,"Noto Sans TC",sans-serif;
  color:#E6E2D8;-webkit-text-size-adjust:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
#bar{position:fixed;left:16px;bottom:max(16px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:stretch;gap:2px;
  width:166px;max-width:calc(100vw - 32px);
  background:rgba(10,15,21,.76);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:10px 14px}
/* A plain disc the size of an icon: the capsule and the boxed chip inside it
   put two frames around what is only a colour. */
/* the metallic extension: remove this rule to take it out */
/* the metallic extension: the same panel as the picker, since it is part of it */
#metalRow{position:fixed;z-index:20;background:rgba(10,15,21,.95);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:9px;
  display:flex;flex-direction:column;gap:3px}
#metalRow[hidden]{display:none}
#pick{position:fixed;z-index:20;background:rgba(10,15,21,.95);
  backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:9px;width:196px}
/* With the colour half hidden there is nothing to be 230px wide for: the panel
   shrinks to the slider and the slider takes the room. */
#pick[data-mode="erase"]{width:168px}
#pick[data-mode="erase"] #opRow{width:100%;margin:0}
#pick[data-mode="erase"] #opRow input{flex:1 1 auto;width:auto}
#pick[hidden]{display:none}
/* An author rule setting display beats the browser's own [hidden] rule, so
   hiding #sv (display:block) or .prow (display:flex) from script did nothing
   at all. Say it once, for everything. */
[hidden]{display:none !important}
#sv,#hue{display:block;width:100%;border-radius:5px;cursor:crosshair;
  touch-action:none}
#hue{margin-top:2px;height:15px}
.prow{display:flex;align-items:center;gap:2px;margin-top:3px}
#hex{width:74px;flex:none;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);border-radius:5px;color:#E6E2D8;
  font:400 11px/1 ui-monospace,Menlo,monospace;padding:6px 7px;text-transform:uppercase}
#recent{display:flex;gap:4px;flex-wrap:wrap}
#recent button{width:17px;height:17px;border-radius:4px;padding:0;cursor:pointer;
  border:1px solid rgba(255,255,255,.22)}
.tb{background:none;border:1px solid rgba(255,255,255,.16);border-radius:999px;
  color:#8A97A6;font:inherit;font-size:11.5px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.tb:hover:not([disabled]){color:#E6E2D8;border-color:rgba(255,255,255,.34)}
.tb[aria-pressed="true"]{background:#6FA8CE;color:#0B1017;border-color:#6FA8CE}
/* An icon draws its own ring, so the button underneath it does not need one
   too - the capsule around each one, and the longer capsule around a group,
   put two or three outlines around the same mark. */
.tb.ic{border:none;background:none}
/* After .tb, or its border comes back and rings the colour. */
.swb{padding:0;border:none;background:none;width:34px;height:34px;
  display:grid;place-items:center}
.swb:hover:not([disabled]){border:none}
.swb i{display:block;width:20px;height:20px;border-radius:999px}
.tb.ic:hover:not([disabled]){color:#E6E2D8}
.tb.ic[aria-pressed="true"]{background:none;color:#6FA8CE}
/* Marked rather than matched with :has, which Safari only learned recently. */
.seg.icons{border:none;overflow:visible;gap:1px}
.seg.icons .tb{border-right:none}
.tb[disabled]{opacity:.32;cursor:default}
/* Icon buttons: one square, so a row holds far more than words did. The label
   survives as the tooltip and for screen readers. */
.tb.ic{padding:0;width:34px;height:34px;display:grid;place-items:center}
/* Laid out in named rows rather than left to wrap, so what sits where is
   decided here and not by however wide the panel happens to be. */
/* Scoped to the toolbar, these left the gradient bar's own row unstyled, so
   its three buttons stacked instead of sitting side by side. */
/* One scale: 4 inside a group, 10 between groups, 6 between rows. */
.row{display:flex;align-items:center;gap:3px}
.row.split{justify-content:space-between}
.grp{display:flex;gap:6px}
/* The grip lies across the top rather than down the side: sideways is the
   direction that covers the garment, so the panel is kept narrow and allowed
   to grow downward instead.
   It is placed against #bar, which is already fixed - saying position again
   here would override that, and the panel would fly off when dragged. */
#bar > .grip{width:100%;height:10px;margin-bottom:2px;
  background:radial-gradient(circle,#E6E2D8 1.1px,transparent 1.2px) 0 3px/6px 6px}
.seg .tb.ic{width:34px;border-radius:999px}
.tb.ic svg{display:block;pointer-events:none}
/* A refused file used to explain itself in words. With those gone the button
   says it instead, since silence reads as a broken button. */
.tb.nope{animation:nope .5s ease}
@keyframes nope{0%,100%{border-color:rgba(255,255,255,.16)}
  30%,70%{border-color:#C86B5C;color:#C86B5C}}
.tb:focus-visible,#sw button:focus-visible,input:focus-visible{outline:2px solid #C4A253;
  outline-offset:2px}
.sep{width:1px;height:20px;background:rgba(255,255,255,.12)}
.seg{display:flex;border:1px solid rgba(255,255,255,.16);border-radius:999px;overflow:hidden}
.seg .tb{border:none;border-radius:0;border-right:1px solid rgba(255,255,255,.16)}
.seg .tb:last-child{border-right:none}
canvas{cursor:crosshair}
canvas.mv{cursor:move}
#ovl{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#ovl > line,#ovl > polygon,#ovl > circle{visibility:hidden}
#dwell{transition:opacity .12s linear}
#pgiz rect{fill:#6FA8CE;stroke:#0B1017;stroke-width:2}
#pbar{position:fixed;left:16px;
  bottom:calc(max(16px,env(safe-area-inset-bottom)) + 62px);display:flex;
  flex-wrap:wrap;width:min(268px,calc(100vw - 32px));
  align-items:center;gap:8px;background:rgba(10,15,21,.85);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:9px 12px;z-index:12}
#pbar[hidden]{display:none}
#gbar{flex-wrap:wrap}
#gmode{width:100%;margin-top:2px}
#gmode[hidden]{display:none}
#gbar{position:fixed;left:16px;
  bottom:calc(max(16px,env(safe-area-inset-bottom)) + 62px);display:flex;
  flex-wrap:wrap;width:min(268px,calc(100vw - 32px));
  align-items:center;gap:8px;background:rgba(10,15,21,.85);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:9px 12px;z-index:12}
#gbar[hidden]{display:none}
#ggiz circle{cursor:grab}
#ggiz .end{stroke-width:3}
#patch{display:block;width:220px;height:220px;border:1px solid rgba(255,255,255,.14);border-radius:10px;
  background:rgba(11,16,23,.92);backdrop-filter:blur(10px);z-index:12;
  pointer-events:none}
/* The drawing pad and its slots, in the corner with the pattern panel. Both
   are kept inside the view and clear of each other by stackPanels. */
.pad{position:fixed;right:16px;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 124px);
  z-index:11;width:166px;background:rgba(10,15,21,.9);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px}
.pad[hidden]{display:none}
/* Cutting a hole has no colour, so the pad hides its colour while the mask is
   open. */
.pad[data-mask="1"] [data-ctl-colour],
.pad[data-mask="1"] [data-ct="colour"]{display:none}
/* Attached to the frame, so the tick is where the shape is rather than across
   the screen in a panel. */
#msbar,#stbar{position:fixed;z-index:13;display:flex;gap:5px;padding:5px;
  transform:translate(-50%,0);background:rgba(10,15,21,.85);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);border-radius:11px}
#msbar[hidden],#stbar[hidden]{display:none}
.pad > .grip{width:100%;height:10px;margin-bottom:4px;
  background:radial-gradient(circle,#E6E2D8 1.1px,transparent 1.2px) 0 3px/6px 6px}
#pad{display:block;width:100%;height:156px;border-radius:8px;cursor:crosshair;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
  touch-action:none}
.padrow{display:flex;gap:3px;margin-top:2px;justify-content:flex-start}
.slots{display:flex;gap:1px;margin-top:2px}
.slot{width:28px;height:28px;padding:0;border-radius:7px;flex:0 0 auto;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);
  cursor:pointer;display:grid;place-items:center}
.slot canvas{width:22px;height:22px;display:block}
.slot[aria-pressed="true"]{border-color:#6FA8CE;background:rgba(111,168,206,.16)}
.slot.empty{opacity:.45}
.pwrap{position:fixed;right:16px;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 124px);
  z-index:11}
.pwrap[hidden]{display:none}
@media (max-width:520px){ .pwrap{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 118px)}
  #patch{width:150px;height:150px} }
.grip{flex:0 0 auto;width:14px;height:26px;cursor:grab;touch-action:none;opacity:.5;
  background:radial-gradient(circle,#E6E2D8 1.1px,transparent 1.2px) 2px 3px/6px 6px}
.grip:hover{opacity:.85}
.grip:active{cursor:grabbing}
.pwrap .grip{position:absolute;left:5px;top:5px;z-index:1}
.phint{font:400 11px/1 ui-monospace,Menlo,monospace;color:#8A97A6}
canvas.grab{cursor:grab}
/* The row never wraps and never squeezes its reading out: the track takes what
   is left after the icon and the number, and may shrink to nothing. */
.sl{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;
  font:400 11px/1 ui-monospace,Menlo,monospace;color:#8A97A6}
.sl svg{flex:0 0 auto}
.sl input{flex:1 1 0;min-width:0;accent-color:#6FA8CE}
/* Wide enough for the longest reading it ever shows - "100.0 cm" - or the
   text is pushed past the end of the row. */
.sl b{font-weight:400;color:#E6E2D8;min-width:52px;text-align:right;
  white-space:nowrap;flex:0 0 auto}
#note{position:fixed;left:0;right:0;top:16px;display:flex;justify-content:center;
  pointer-events:none;z-index:30;
  padding:0 16px;pointer-events:none}
#note span{background:rgba(10,15,21,.8);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:8px 14px;font:400 12px/1.5 ui-monospace,Menlo,monospace;
  color:#8A97A6;max-width:640px;text-align:center;white-space:pre-line}
#note span.warn{color:#C4A253;border-color:rgba(196,162,83,.4)}
#note span.bad{color:#C86B5C;border-color:rgba(200,107,92,.45)}
#drop{position:fixed;inset:0;display:none;place-items:center;z-index:9;
  background:rgba(14,20,27,.9);border:2px dashed #6FA8CE;color:#6FA8CE;
  font:400 14px/1 ui-monospace,Menlo,monospace}
#drop.on{display:grid}
#err{position:fixed;inset:0;display:none;place-items:center;color:#C86B5C;padding:24px;
  font:400 13px/1.8 ui-monospace,Menlo,monospace;text-align:center;white-space:pre-line}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* the build it came from, small and out of the way */
#ver{position:fixed;right:6px;bottom:4px;z-index:5;pointer-events:none;
  font:400 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:rgba(255,255,255,.28);letter-spacing:.4px;
  text-shadow:0 1px 2px rgba(0,0,0,.5)}
</style>

<div id="pick" hidden>
  <canvas id="sv" width="178" height="124"></canvas>

  <canvas id="patch" width="300" height="300"></canvas></div>

<script>
/* Read while the painter sizes its buffers, so it lives at the very top of the
   script. Declared further down it fell in the dead zone; tucked inside a
   function it did not exist outside one. Both stopped the page loading. */
const touch = matchMedia('(pointer: coarse)').matches;

/* Which set of controls the picker is editing. Read by the picker, which runs
   long before the controls are wired, so it lives up here with touch. */
/* Both sets of settings, at the top of the file: the picker, the strokes and
   the pad all read them, and each of those runs long before the controls that
   change them are built. */
const ctlState = {
  bar: {tool: 'brush', erase: false, colour: [0.886, 0.231, 0.180],
        flow: 1, eraseFlow: 1, smooth: 0, size: 45},
  paint: {tool: 'brush', erase: false, colour: [0.93, 0.93, 0.93],
          flow: 1, eraseFlow: 1, smooth: 0, size: 45},
  mask:  {tool: 'brush', erase: false, colour: [1, 1, 1],
          flow: 1, eraseFlow: 1, smooth: 0, size: 45},
};

let ctlWho = 'bar';
let maskPart = null;   // which part of a mask shape's frame was grabbed

/* ---- metallic, an extension ------------------------------------------------
   Off unless asked for. The angle is measured in the garment's own frame, so
   the same stroke bakes the same sheen wherever you happen to be standing. */
let metalOn = false;
const metal = {angle: -0.8, tight: 6, dark: 0.3};
let metalRowWas = null;   // what the panel was last told to do
/* The sheen at one point along the light, as a fraction from 0 to 1. The one
   rule both surfaces use: the garment feeds it a place on the cloth, the pad
   feeds it a place on its own square. Only the coordinate differs. */
/* Which cells a fill reaches, on a square grid of side n. One thing decides it:
   whether the aliasing step called a cell solid. Every cell it called bare is
   reached, residual ink and all - those faint cells are the edge of the line,
   and leaving them out is a ring of bare cloth around everything filled.
   Which cells count as wall is settled before this runs, not here.
   The garment and the pad both ask this, so they cannot drift apart. */
/* Which cells a fill may not enter: any that hold ink at all. Judging a faint
   cell against its neighbours cannot work - a cell of 70 beside one of 255 is
   either the soft edge of the strong line or a faint line of its own, and
   nothing local tells them apart. Weighing it lost every faint line that ran
   beside a strong one, and the fill escaped through the holes. */
function aliasWall(n, alphaAt) {
  const solid = new Uint8Array(n*n);
  for (let i = 0; i < n*n; i++) solid[i] = alphaAt(i) ? 1 : 0;
  return solid;
}

/* The cells where the fill meets ink, and how much of each one the ink really
   held. They are the line's soft edge: part covered, so bare cloth shows
   through them as a pale ring around everything filled.
   Each is taken to full strength here, which leaves a hard jagged edge between
   two solid colours - and the share it used to hold is handed back, so one
   later pass can put exactly that much of each colour into it. Mixing as we go
   instead, and then softening on top, blended the same boundary twice and
   spread it over several cells, which is what reads as a ring.
   Only cells the fill touches are settled, so the far side of a line is left
   exactly as it was drawn. */
function settleRim(n, out, alphaAt, harden) {
  /* Until nothing moves, since a cell settled this way can bring the next one
     into reach. */
  const done = new Uint8Array(n*n);
  const share = new Float32Array(n*n);   // how much of it the ink held
  for (;;) {
    const rim = [];
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const i = y*n + x, a = alphaAt(i);
      if (done[i] || out[i] || !a || a === 255) continue;
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nx = x+dx, ny = y+dy;
        if (nx < 0 || ny < 0 || nx >= n || ny >= n) continue;
        if (out[ny*n + nx]) { rim.push(i); break; }
      }
    }
    if (!rim.length) break;
    for (const i of rim) { done[i] = 1; share[i] = alphaAt(i)/255; harden(i); }
  }
  return share;
}

function fillRegion(n, seeds, solid) {
  const out = new Uint8Array(n*n);
  const q = [];
  for (const i of seeds) { if (!solid[i]) { out[i] = 1; q.push(i); } }
  while (q.length) {
    const i = q.pop(), x = i % n, y = (i/n)|0;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x+dx, ny = y+dy;
      if (nx < 0 || ny < 0 || nx >= n || ny >= n) continue;
      const j = ny*n + nx;
      if (out[j] || solid[j]) continue;
      out[j] = 1;
      q.push(j);
    }
  }
  return out;
}

function metalSheen(t) {
  return Math.exp(-t*t*metal.tight*0.35);
}

/* The colour that sheen makes of a base colour. */
function metalInk(base, sheen) {
  const lit = 0.45 + 0.55*0.9;             // the pad is flat, so fully lit
  return base.map((v, i) => {
    const body = v*metal.dark + (v - v*metal.dark)*lit;
    const tint = v + (1 - v)*0.8;
    return body + (tint - body)*sheen*0.9;
  });
}

function metalDir() {
  /* Around the garment's upright axis: an angle of zero lights it from the
     front, negative from the left. The camera plays no part. */
  const a = metal.angle;
  return new Float32Array([Math.sin(a)*0.8, 0.55, Math.cos(a)*0.8]);
}

/* The strength a stroke goes down at. Erasing keeps its own, so switching to it
   does not borrow the brush's - and every stroke asks here rather than reaching
   for `flow`, which is only the brush's. */
function strokeFlow() {
  const st = ctlState.bar;
  return st.erase ? st.eraseFlow : st.flow;
}

/* ==================== procedural garment ====================
   One of the mesh sources. Everything below the FORMATS section treats it
   exactly like an imported file. */
/**
 * Procedural t-shirt generator. No dependencies, no build step.
 *
 * Pattern-piece construction: four pieces are laid out in 2D pattern space and
 * wrapped onto a tapering elliptical section. Pattern coordinates are measured
 * in real surface arc length, so UV distortion is near zero by construction
 * rather than by unwrapping afterwards.
 *
 * Runs identically in node and in the browser.
 */

const DEFAULTS = {
  aHalf: 0.220,        // body half width at the chest
  bHalf: 0.090,        // body half depth at the chest
  aTop: 0.236,         // half width at the shoulder line
  bTop: 0.062,         // half depth at the shoulder line
  hBody: 0.700,        // hem to shoulder line
  yArmpit: 0.430,      // height of the underarm point
  shoulderSlope: 0.038,
  neckDropF: 0.078,
  neckDropB: 0.026,
  sleeveLen: 0.205,
  sleeveTaper: 0.78,   // cuff radius as a fraction of the armhole radius
  sleeveDroop: 0.30,
  rFold: 0.048,        // vertical radius of the shoulder roll
  sNeck: 18 / 48,      // where the neckline meets the shoulder seam
  sShldr: 44 / 48,     // where the shoulder seam meets the sleeve head
  nA: 14, nB: 20, nC: 18,   // columns per region: neck, shoulder seam, armhole
  nT: 36,              // rows up a panel
  nRing: 12,           // rings along a sleeve
  uvPad: 0.012,
};

const NY = 160, NARC = 512, NB_SAMP = 220, NF_SAMP = 60;

const lerpArr = (xs, ys, x) => {           // np.interp, xs ascending
  if (x <= xs[0]) return ys[0];
  const n = xs.length;
  if (x >= xs[n - 1]) return ys[n - 1];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (xs[m] <= x) lo = m; else hi = m; }
  const t = (x - xs[lo]) / (xs[hi] - xs[lo] || 1);
  return ys[lo] + (ys[hi] - ys[lo]) * t;
};

function linspace(a, b, n, endpoint = true) {
  const out = new Array(n), d = endpoint ? (n > 1 ? (b - a) / (n - 1) : 0) : (b - a) / n;
  for (let i = 0; i < n; i++) out[i] = a + d * i;
  return out;
}

function build(opts = {}) {
  const P = { ...DEFAULTS, ...opts };
  const NS = 2 * (P.nA + P.nB + P.nC);
  const I_MID = P.nA + P.nB + P.nC;
  const I_SHLDR = I_MID + P.nA + P.nB;
  const NT = P.nT;

  const S_COL = [
    ...linspace(1.0, P.sShldr, P.nC, false).map(v => -v),
    ...linspace(P.sShldr, P.sNeck, P.nB, false).map(v => -v),
    ...linspace(P.sNeck, 0.0, P.nA, false).map(v => -v),
    ...linspace(0.0, P.sNeck, P.nA, false),
    ...linspace(P.sNeck, P.sShldr, P.nB, false),
    ...linspace(P.sShldr, 1.0, P.nC + 1),
  ];

  // 0 below the underarm, easing to 1 at the shoulder, so the change in
  // cross-section leaves no horizontal crease.
  const taper = y => {
    if (y <= P.yArmpit) return 0;
    const w = Math.min(1, (y - P.yArmpit) / (P.hBody - P.yArmpit));
    return w * w * (3 - 2 * w);
  };
  const section = y => {
    const k = taper(y);
    return [P.aHalf + (P.aTop - P.aHalf) * k, P.bHalf + (P.bTop - P.bHalf) * k];
  };

  // theta as a function of (height, arc-length fraction). Sampling arc length
  // rather than theta is what keeps the pattern free of distortion: equal
  // steps in s are equal steps of fabric.
  const ys = linspace(0, P.hBody, NY);
  const NTH = 1600;
  const th = new Float64Array(NTH), sn = new Float64Array(NTH), cs = new Float64Array(NTH);
  for (let k = 0; k < NTH; k++) {
    th[k] = -Math.PI / 2 + Math.PI * k / (NTH - 1);
    sn[k] = Math.sin(th[k]); cs[k] = Math.cos(th[k]);
  }
  const TH = new Float64Array(NY * NARC), HALF = new Float64Array(NY);
  const cum = new Float64Array(NTH);
  for (let i = 0; i < NY; i++) {
    const [a, b] = section(ys[i]);
    for (let k = 1; k < NTH; k++) {
      const dx = a * (sn[k] - sn[k - 1]), dz = b * (cs[k] - cs[k - 1]);
      cum[k] = cum[k - 1] + Math.sqrt(dx * dx + dz * dz);
    }
    HALF[i] = cum[NTH - 1];
    // cum and the targets are both ascending, so one forward walk replaces a
    // binary search per sample
    let j = 0;
    for (let q = 0; q < NARC; q++) {
      const x = HALF[i] * q / (NARC - 1);
      while (j < NTH - 2 && cum[j + 1] < x) j++;
      const d = cum[j + 1] - cum[j];
      TH[i * NARC + q] = th[j] + (th[j + 1] - th[j]) * (d > 0 ? (x - cum[j]) / d : 0);
    }
  }
  const arcHalf = y => lerpArr(ys, HALF, y);

  function wrap(s, y) {
    const fy = Math.min(Math.max(y / P.hBody, 0), 1) * (NY - 1);
    const i0 = Math.min(NY - 1, Math.floor(fy)), i1 = Math.min(i0 + 1, NY - 1);
    const w = fy - i0;
    const g = (s + 1) / 2 * (NARC - 1);
    const j0 = Math.min(NARC - 1, Math.max(0, Math.floor(g))), j1 = Math.min(j0 + 1, NARC - 1);
    const u = g - j0;
    const t = (TH[i0 * NARC + j0] * (1 - u) + TH[i0 * NARC + j1] * u) * (1 - w)
            + (TH[i1 * NARC + j0] * (1 - u) + TH[i1 * NARC + j1] * u) * w;
    const [a, b] = section(y);
    return [a * Math.sin(t), b * Math.cos(t)];
  }

  const topEdge = (s, neckDrop) => {
    const u = Math.abs(s), yOut = P.hBody - P.shoulderSlope;
    if (u <= P.sNeck) return P.hBody - neckDrop * Math.cos(u / P.sNeck * Math.PI / 2);
    if (u <= P.sShldr) return P.hBody - P.shoulderSlope * (u - P.sNeck) / (P.sShldr - P.sNeck);
    const w = (u - P.sShldr) / (1 - P.sShldr);
    return yOut + (P.yArmpit - yOut) * Math.sin(w * Math.PI / 2);
  };

  // How far a column folds over the shoulder, as a fraction of local half
  // depth. 1 means it reaches Z=0 and meets the opposite panel: that is the
  // shoulder seam. Falling to 0 across the neck opens the neckline; falling to
  // 0 across the armhole opens the armhole. Both holes, made the same way.
  const fold = s => {
    const u = Math.abs(s);
    if (u <= P.sNeck) return Math.sin(u / P.sNeck * Math.PI / 2);
    if (u <= P.sShldr) return 1;
    return 1 - (u - P.sShldr) / (1 - P.sShldr);
  };

  function buildPanel(front) {
    const sign = front ? 1 : -1, neckDrop = front ? P.neckDropF : P.neckDropB;
    const pos = new Float64Array((NS + 1) * (NT + 1) * 3);
    const uv = new Float64Array((NS + 1) * (NT + 1) * 2);

    for (let i = 0; i <= NS; i++) {
      const s = S_COL[i], yTop = topEdge(s, neckDrop);
      const [xTop, zTop] = wrap(s, yTop);
      const flap = zTop * fold(s), rv = Math.min(P.rFold, flap);

      const pts = [];
      for (let k = 0; k < NB_SAMP; k++) {
        const y = (yTop - rv) * k / (NB_SAMP - 1);
        const [x, zf] = wrap(s, y);
        pts.push([x, y, sign * zf]);
      }
      // Quarter ellipse: vertical tangent leaving the body, horizontal tangent
      // meeting the opposite panel at the shoulder seam.
      for (let k = 1; k <= NF_SAMP; k++) {
        const a = Math.PI / 2 * k / NF_SAMP;
        pts.push([xTop, yTop - rv + rv * Math.sin(a),
                  sign * (zTop - flap * (1 - Math.cos(a)))]);
      }
      const keep = [pts[0]];
      for (let k = 1; k < pts.length; k++) {
        const p = pts[k], q = keep[keep.length - 1];
        if (Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]) > 1e-7) keep.push(p);
      }
      const cum = [0];
      for (let k = 1; k < keep.length; k++) {
        const p = keep[k], q = keep[k - 1];
        cum.push(cum[k - 1] + Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]));
      }
      const last = cum.length - 1;
      let g = 0;
      for (let j = 0; j <= NT; j++) {
        const want = cum[last] * j / NT, o = i * (NT + 1) + j;
        while (g < last - 1 && cum[g + 1] < want) g++;
        const d = cum[g + 1] - cum[g], t = d > 0 ? (want - cum[g]) / d : 0;
        for (let c = 0; c < 3; c++)
          pos[o * 3 + c] = keep[g][c] + (keep[g + 1][c] - keep[g][c]) * t;
        uv[o * 2] = (s + 1) / 2 * arcHalf(pos[o * 3 + 1]);
        uv[o * 2 + 1] = want;
      }
    }

    const faces = [];
    for (let i = 0; i < NS; i++) for (let j = 0; j < NT; j++) {
      const a = i * (NT + 1) + j, b = (i + 1) * (NT + 1) + j;
      const c = (i + 1) * (NT + 1) + j + 1, d = i * (NT + 1) + j + 1;
      if (front) faces.push([a, b, c], [a, c, d]);
      else faces.push([a, c, b], [a, d, c]);
    }
    return { pos, uv, faces };
  }

  const front = buildPanel(true), back = buildPanel(false);
  const topOf = (panel, i) => {
    const o = (i * (NT + 1) + NT) * 3;
    return [panel.pos[o], panel.pos[o + 1], panel.pos[o + 2]];
  };

  // Walk the front panel's top edge from the sleeve head to the underarm, then
  // back up the back panel's. The panels already coincide at both ends, so the
  // loop closes exactly and the sleeve seam matches by construction.
  function armholeLoop(side) {
    const idx = side > 0
      ? Array.from({ length: NS + 1 - I_SHLDR }, (_, k) => I_SHLDR + k)
      : Array.from({ length: NS - I_SHLDR + 1 }, (_, k) => NS - I_SHLDR - k);
    const pts = idx.map(i => topOf(front, i));
    for (let k = idx.length - 2; k >= 1; k--) pts.push(topOf(back, idx[k]));
    return pts;
  }

  function buildSleeve(loop, side) {
    const n = loop.length;
    const c0 = [0, 1, 2].map(c => loop.reduce((a, p) => a + p[c], 0) / n);
    let d = [side, -P.sleeveDroop, 0];
    const dl = Math.hypot(...d); d = d.map(v => v / dl);
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2],
                             a[0] * b[1] - a[1] * b[0]];
    let e1 = cross(d, [0, 1, 0]); const l1 = Math.hypot(...e1);
    e1 = e1.map(v => v / l1);
    const e2 = cross(d, e1);

    const along = [], rad = [], ang = [];
    for (const p of loop) {
      const r = [p[0] - c0[0], p[1] - c0[1], p[2] - c0[2]];
      const al = r[0] * d[0] + r[1] * d[1] + r[2] * d[2];
      const pe = [r[0] - al * d[0], r[1] - al * d[1], r[2] - al * d[2]];
      along.push(al); rad.push(Math.hypot(...pe));
      ang.push(Math.atan2(pe[0] * e2[0] + pe[1] * e2[1] + pe[2] * e2[2],
                          pe[0] * e1[0] + pe[1] * e1[1] + pe[2] * e1[2]));
    }
    const rMean = rad.reduce((a, b) => a + b, 0) / n;

    const rings = [];
    for (let m = 0; m <= P.nRing; m++) {
      const f = m / P.nRing, circ = Math.pow(f, 0.8);   // ease into a round cuff
      const sc = 1 + (P.sleeveTaper - 1) * f;
      const ring = [];
      for (let k = 0; k < n; k++) {
        const r = (rad[k] * (1 - circ) + rMean * circ) * sc;
        const ca = Math.cos(ang[k]), sa = Math.sin(ang[k]), ax = along[k] * (1 - f);
        ring.push([
          c0[0] + d[0] * P.sleeveLen * f + r * ca * e1[0] + r * sa * e2[0] + ax * d[0],
          c0[1] + d[1] * P.sleeveLen * f + r * ca * e1[1] + r * sa * e2[1] + ax * d[1],
          c0[2] + d[2] * P.sleeveLen * f + r * ca * e1[2] + r * sa * e2[2] + ax * d[2]]);
      }
      rings.push(ring);
    }

    // The loop is closed, so the UV island needs a cut. Duplicating column 0
    // at the end puts that cut under the arm, the least visible place.
    const w = n + 1;
    const pos = new Float64Array((P.nRing + 1) * w * 3);
    const uv = new Float64Array((P.nRing + 1) * w * 2);
    const v = [0];
    for (let m = 1; m <= P.nRing; m++) {
      let s = 0;
      for (let k = 0; k < n; k++) s += Math.hypot(
        rings[m][k][0] - rings[m - 1][k][0], rings[m][k][1] - rings[m - 1][k][1],
        rings[m][k][2] - rings[m - 1][k][2]);
      v.push(v[m - 1] + s / n);
    }
    for (let m = 0; m <= P.nRing; m++) {
      const ring = [...rings[m], rings[m][0]];
      const cum = [0];
      for (let k = 1; k < w; k++) cum.push(cum[k - 1] + Math.hypot(
        ring[k][0] - ring[k - 1][0], ring[k][1] - ring[k - 1][1],
        ring[k][2] - ring[k - 1][2]));
      for (let k = 0; k < w; k++) {
        const o = m * w + k;
        pos[o * 3] = ring[k][0]; pos[o * 3 + 1] = ring[k][1]; pos[o * 3 + 2] = ring[k][2];
        uv[o * 2] = cum[k] - cum[w - 1] / 2;   // centre each ring: the pattern
        uv[o * 2 + 1] = v[m];                  // is a trapezoid, like a real one
      }
    }
    const faces = [];
    for (let m = 0; m < P.nRing; m++) for (let k = 0; k < n; k++) {
      const a = m * w + k, b = (m + 1) * w + k, c = (m + 1) * w + k + 1, e = m * w + k + 1;
      faces.push([a, b, c], [a, c, e]);
    }
    return { pos, uv, faces };
  }

  const loopR = armholeLoop(+1), loopL = armholeLoop(-1);
  const slR = buildSleeve(loopR, +1), slL = buildSleeve(loopL, -1);

  // Flip winding if most faces point back toward the reference axis.
  function orientOutward(part, ref, axis) {
    let votes = 0;
    for (const f of part.faces) {
      const p = f.map(i => [part.pos[i * 3], part.pos[i * 3 + 1], part.pos[i * 3 + 2]]);
      const a = [p[1][0] - p[0][0], p[1][1] - p[0][1], p[1][2] - p[0][2]];
      const b = [p[2][0] - p[0][0], p[2][1] - p[0][1], p[2][2] - p[0][2]];
      const nx = a[1] * b[2] - a[2] * b[1], ny = a[2] * b[0] - a[0] * b[2],
            nz = a[0] * b[1] - a[1] * b[0];
      let o = [(p[0][0] + p[1][0] + p[2][0]) / 3 - ref[0],
               (p[0][1] + p[1][1] + p[2][1]) / 3 - ref[1],
               (p[0][2] + p[1][2] + p[2][2]) / 3 - ref[2]];
      if (axis) { const dp = o[0] * axis[0] + o[1] * axis[1] + o[2] * axis[2];
        o = [o[0] - dp * axis[0], o[1] - dp * axis[1], o[2] - dp * axis[2]]; }
      if (nx * o[0] + ny * o[1] + nz * o[2] > 0) votes++;
    }
    if (votes < part.faces.length / 2)
      part.faces = part.faces.map(f => [f[0], f[2], f[1]]);
  }
  const bodyRef = [0, P.yArmpit / 2, 0];
  orientOutward(front, bodyRef, [0, 1, 0]);
  orientOutward(back, bodyRef, [0, 1, 0]);
  for (const [sl, loop, side] of [[slR, loopR, 1], [slL, loopL, -1]]) {
    const c = [0, 1, 2].map(k => loop.reduce((a, p) => a + p[k], 0) / loop.length);
    let d = [side, -P.sleeveDroop, 0]; const dl = Math.hypot(...d);
    orientOutward(sl, c, d.map(v => v / dl));
  }

  // Faces are wound counter-clockwise seen from outside. A piece whose UV area
  // comes out negative under that same vertex order has a flipped mapping:
  // projected paint still lands right, but text stamped straight into the
  // texture reads backwards. One handedness everywhere keeps the atlas
  // directly editable.
  function orientUV(part) {
    let s = 0;
    for (const f of part.faces) {
      const [a, b, c] = f.map(i => [part.uv[i * 2], part.uv[i * 2 + 1]]);
      s += (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    }
    if (s < 0) {
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i < part.uv.length; i += 2) {
        lo = Math.min(lo, part.uv[i]); hi = Math.max(hi, part.uv[i]);
      }
      for (let i = 0; i < part.uv.length; i += 2) part.uv[i] = lo + hi - part.uv[i];
    }
  }
  [front, back, slL, slR].forEach(orientUV);

  // ---- pack islands at one shared texel density -------------------------
  const parts = [['front', front], ['back', back],
                 ['sleeve_left', slL], ['sleeve_right', slR]];
  const ext = {};
  for (const [name, p] of parts) {
    let u0 = Infinity, v0 = Infinity, u1 = -Infinity, v1 = -Infinity;
    for (let i = 0; i < p.uv.length; i += 2) {
      u0 = Math.min(u0, p.uv[i]); u1 = Math.max(u1, p.uv[i]);
      v0 = Math.min(v0, p.uv[i + 1]); v1 = Math.max(v1, p.uv[i + 1]);
    }
    ext[name] = { u0, v0, w: u1 - u0, h: v1 - v0 };
  }
  const gap = 0.030, row1 = Math.max(ext.front.h, ext.back.h);
  const org = {
    front: [0, 0], back: [ext.front.w + gap, 0],
    sleeve_left: [0, row1 + gap], sleeve_right: [ext.sleeve_left.w + gap, row1 + gap],
  };
  const totalW = Math.max(ext.front.w + gap + ext.back.w,
                          ext.sleeve_left.w + gap + ext.sleeve_right.w);
  const totalH = row1 + gap + Math.max(ext.sleeve_left.h, ext.sleeve_right.h);
  const scale = (1 - 2 * P.uvPad) / Math.max(totalW, totalH);

  const rects = {};
  for (const [name, p] of parts) {
    const e = ext[name], [ox, oy] = org[name];
    for (let i = 0; i < p.uv.length; i += 2) {
      p.uv[i] = (p.uv[i] - e.u0 + ox) * scale + P.uvPad;
      // glTF UV origin is top-left; the pattern origin is the hem
      p.uv[i + 1] = 1 - ((p.uv[i + 1] - e.v0 + oy) * scale + P.uvPad);
    }

    const l = Math.hypot(normal[i * 3], normal[i * 3 + 1], normal[i * 3 + 2]) || 1;

  const iNeck = I_MID + P.nA;
  const fTop = i => topOf(front, i), bTop = i => topOf(back, i);
  const measurements = {

    length_cm: P.hBody * 100,

    neck_width_cm: 2 * Math.abs(fTop(iNeck)[0]) * 100,
    neck_depth_cm: (fTop(I_MID)[2] - bTop(I_MID)[2]) * 100,
    sleeve_cm: P.sleeveLen * 100,

    scene: 0, scenes: [{ nodes: [0] }], nodes: [{ mesh: 0, name: 'tshirt' }],
    meshes: [{ name: 'tshirt', primitives: [{

    materials: [{ name: 'fabric', doubleSided: true, pbrMetallicRoughness: {
