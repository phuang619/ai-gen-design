    for (let t = 0; t < X.length; t += 3) {
      const a = X[t]*3, b = X[t+1]*3, c = X[t+2]*3;
      const e1 = [P[b]-P[a], P[b+1]-P[a+1], P[b+2]-P[a+2]];
      const e2 = [P[c]-P[a], P[c+1]-P[a+1], P[c+2]-P[a+2]];
      const cr = cross(e1, e2);
      cloth += Math.hypot(cr[0], cr[1], cr[2])/2;
    }
  }
  const centre = [(lo[0]+hi[0])/2, (lo[1]+hi[1])/2, (lo[2]+hi[2])/2];

  // UV range
  let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
  for (const p of parts) for (let i = 0; i < p.uv.length; i += 2) {
    if (p.uv[i] < u0) u0 = p.uv[i]; if (p.uv[i] > u1) u1 = p.uv[i];
    if (p.uv[i+1] < v0) v0 = p.uv[i+1]; if (p.uv[i+1] > v1) v1 = p.uv[i+1];
  }
  if (u0 < -0.001 || u1 > 1.001 || v0 < -0.001 || v1 > 1.001)
    issues.push({level: 'warn', text: 'UVs run outside 0–1 (tiling). '
      + 'Paint outside that range has nowhere to be stored and will be lost.'});

  // texel density, and whether it is uniform enough for a physical brush size
  const dens = [];
  let area = 0;
  for (const p of parts) {
    const P = p.position, U = p.uv, I = p.index;
    for (let t = 0; t < I.length; t += 3) {
      const a = I[t], b = I[t+1], c = I[t+2];
      const ax = P[b*3]-P[a*3], ay = P[b*3+1]-P[a*3+1], az = P[b*3+2]-P[a*3+2];
      const bx = P[c*3]-P[a*3], by = P[c*3+1]-P[a*3+1], bz = P[c*3+2]-P[a*3+2];
      const a3 = 0.5 * Math.hypot(ay*bz-az*by, az*bx-ax*bz, ax*by-ay*bx);
      const a2 = Math.abs(0.5 * ((U[b*2]-U[a*2])*(U[c*2+1]-U[a*2+1])
                               - (U[b*2+1]-U[a*2+1])*(U[c*2]-U[a*2])));
      area += a3;
      if (a2 > 1e-14 && a3 > 1e-14) dens.push(Math.sqrt(a3 / a2));
    }
  }
  dens.sort((x, y) => x - y);
  const med = dens[dens.length >> 1] || 1;
  const spread = (dens[Math.floor(dens.length * 0.98)] || med) /
                 (dens[Math.floor(dens.length * 0.02)] || med);
  if (spread > 2.0)
    issues.push({level: 'warn', text: 'Texel density varies by '
      + spread.toFixed(1) + '× across this model, so a brush that covers 2 cm '
      + 'in one place will cover much more elsewhere.'});

  // Faces whose UV winding runs against the majority carry a mirrored mapping:
  // strokes and lettering come out reversed there.
  let flipped = 0, totalA = 0;
  for (const p of parts) {
    const P = p.position, U = p.uv, I = p.index;
    for (let t = 0; t < I.length; t += 3) {
      const a = I[t], b = I[t+1], c = I[t+2];
      const ax = P[b*3]-P[a*3], ay = P[b*3+1]-P[a*3+1], az = P[b*3+2]-P[a*3+2];
      const bx = P[c*3]-P[a*3], by = P[c*3+1]-P[a*3+1], bz = P[c*3+2]-P[a*3+2];
      const a3 = 0.5*Math.hypot(ay*bz-az*by, az*bx-ax*bz, ax*by-ay*bx);
      const sg = (U[b*2]-U[a*2])*(U[c*2+1]-U[a*2+1])
               - (U[b*2+1]-U[a*2+1])*(U[c*2]-U[a*2]);
      totalA += a3;
      if (sg < 0) flipped += a3;
    }
  }
  const fr = Math.min(flipped, totalA-flipped)/Math.max(totalA, 1e-9);
  if (fr > 0.005)
    issues.push({level: 'warn', text: (fr*100).toFixed(0) + '% of this model has '
      + 'mirrored UV winding. Strokes there will come out reversed — it is a '
      + 'defect in the model, not something painting can correct.'});

  // The fatal one: two surfaces sharing a texel means painting one place also
  // paints another. Almost every free game-asset shirt mirrors left and right.
  const G = 512, owner = new Int32Array(G * G).fill(-1);
  let clash = 0, used = 0, pid = 0;
  for (const p of parts) {
    const U = p.uv, I = p.index;
    const lab = islandLabels(p);
    for (let t = 0; t < I.length; t += 3) {
      const k = pid + lab[I[t]];
      const ax = U[I[t]*2]*(G-1),   ay = U[I[t]*2+1]*(G-1);
      const bx = U[I[t+1]*2]*(G-1), by = U[I[t+1]*2+1]*(G-1);
      const cx = U[I[t+2]*2]*(G-1), cy = U[I[t+2]*2+1]*(G-1);
      const x0 = Math.max(0, Math.min(ax,bx,cx)|0), x1 = Math.min(G-1, Math.ceil(Math.max(ax,bx,cx)));
      const y0 = Math.max(0, Math.min(ay,by,cy)|0), y1 = Math.min(G-1, Math.ceil(Math.max(ay,by,cy)));
      const det = (by-cy)*(ax-cx) + (cx-bx)*(ay-cy);
      if (Math.abs(det) < 1e-9) continue;
      // A low-poly model has huge UV triangles. Skipping them - which is the
      // obvious way to bound cost - would silently disable this check on
      // exactly the models most likely to be mirrored. Stride instead.
      const step = Math.max(1, Math.ceil(Math.max(x1-x0, y1-y0) / 96));
      for (let y = y0; y <= y1; y += step)
        for (let x = x0; x <= x1; x += step) {
          const l0 = ((by-cy)*(x-cx) + (cx-bx)*(y-cy))/det;
          const l1 = ((cy-ay)*(x-cx) + (ax-cx)*(y-cy))/det;
          if (l0 < 0 || l1 < 0 || l0+l1 > 1) continue;
          const c = y*G+x;
          if (owner[c] < 0) used++; else if (owner[c] !== k) clash++;
          owner[c] = k;
        }
    }
    pid += 100000;
  }
  const overlap = clash / Math.max(used, 1);
  if (overlap > 0.02)
    issues.push({level: 'bad', text: 'About ' + (overlap*100).toFixed(0)
      + '% of this model\u2019s texels are shared by two surfaces, usually because '
      + 'left and right are mirrored onto the same UVs. Painting one side will '
      + 'paint the other. No renderer can work around this — the model needs '
      + 'a fresh UV unwrap.'});

  const unit = guessUnit(size[1]);
  return {parts, meta: raw.meta || {}, lo, hi, size, centre, radius, cloth, uvPerWorld, up,
          unitCm: unit.cm, unitName: unit.name,
          cmPerUv: med * unit.cm, area, vertices: nv, triangles: nt, issues};
}

// Imported models arrive in whatever unit the author happened to use. Guessing
// is better than silently asserting metres, and showing the guess lets the user
// catch it when it is wrong.
function guessUnit(h) {
  if (h >= 0.3 && h <= 3)     return {cm: 100,  name: 'm'};
  if (h >= 20 && h <= 400)    return {cm: 1,    name: 'cm'};
  if (h >= 400 && h <= 4000)  return {cm: 0.1,  name: 'mm'};
  return {cm: 100, name: 'm?'};
}

/**
 * Angle-limited ("auto") smoothing.
 *
 * Faces meeting at a vertex are averaged only with the neighbours whose own
 * normal is within `angleDeg` of theirs. Below the threshold the surface reads
 * as smooth; above it, a crease survives. Plain averaging would round off the
 * neckline and cuffs; plain face normals would facet the whole garment.
 *
 * Corners at one vertex can end up with different normals, so the vertex is
 * split where they disagree - which is what a hard edge is, in a vertex buffer.
 */
function autoSmooth(p, angleDeg) {
  const P = p.position, I = p.index;
  const nv = P.length / 3, nf = I.length / 3;
  const cosT = Math.cos(angleDeg * Math.PI / 180);

  // weld by position so smoothing carries across UV seams
  const wid = new Int32Array(nv), wk = new Map();
  for (let i = 0; i < nv; i++) {
    const k = Math.round(P[i*3]*1e5) + ',' + Math.round(P[i*3+1]*1e5) + ','
            + Math.round(P[i*3+2]*1e5);
    let w = wk.get(k);
    if (w === undefined) { w = wk.size; wk.set(k, w); }
    wid[i] = w;
  }
  const nw = wk.size;

  // unnormalised face normals: their length is twice the area, so larger faces
  // carry more weight in the average
  const FN = new Float32Array(nf * 3);
  for (let t = 0; t < nf; t++) {
    const a = I[t*3], b = I[t*3+1], c = I[t*3+2];
    const ax = P[b*3]-P[a*3], ay = P[b*3+1]-P[a*3+1], az = P[b*3+2]-P[a*3+2];
    const bx = P[c*3]-P[a*3], by = P[c*3+1]-P[a*3+1], bz = P[c*3+2]-P[a*3+2];
    FN[t*3]   = ay*bz - az*by;
    FN[t*3+1] = az*bx - ax*bz;
    FN[t*3+2] = ax*by - ay*bx;
  }

  // faces incident to each welded vertex, as a flat CSR list
  const start = new Int32Array(nw + 1);
  for (let c = 0; c < nf*3; c++) start[wid[I[c]] + 1]++;
  for (let i = 0; i < nw; i++) start[i+1] += start[i];
  const list = new Int32Array(nf * 3), cur = start.slice(0, nw);
  for (let t = 0; t < nf; t++)
    for (let k = 0; k < 3; k++) list[cur[wid[I[t*3+k]]]++] = t;

  const NP = [], NN = [], NU = [], out = new Uint32Array(nf * 3);
  const seen = new Map();
  const U = p.uv;
  for (let t = 0; t < nf; t++) {
    const fx = FN[t*3], fy = FN[t*3+1], fz = FN[t*3+2];
    const fl = Math.hypot(fx, fy, fz) || 1;
    const nx = fx/fl, ny = fy/fl, nz = fz/fl;
    for (let k = 0; k < 3; k++) {
      const v = I[t*3+k], w = wid[v];
      let ax = 0, ay = 0, az = 0;
      for (let s = start[w]; s < start[w+1]; s++) {
        const o = list[s];
        const ox = FN[o*3], oy = FN[o*3+1], oz = FN[o*3+2];
        const ol = Math.hypot(ox, oy, oz) || 1;
        if ((ox*nx + oy*ny + oz*nz) / ol >= cosT) { ax += ox; ay += oy; az += oz; }
      }
      let l = Math.hypot(ax, ay, az);
      if (l < 1e-20) { ax = nx; ay = ny; az = nz; l = 1; }
      ax /= l; ay /= l; az /= l;
      const key = v + '|' + Math.round(ax*512) + ',' + Math.round(ay*512) + ','
                + Math.round(az*512);
      let n = seen.get(key);
      if (n === undefined) {
        n = NP.length / 3;
        NP.push(P[v*3], P[v*3+1], P[v*3+2]);
        NU.push(U ? U[v*2] : 0, U ? U[v*2+1] : 0);
        NN.push(ax, ay, az);
        seen.set(key, n);
      }
      out[t*3+k] = n;
    }
  }
  return {position: new Float32Array(NP), normal: new Float32Array(NN),
          uv: new Float32Array(NU), index: out};
}

function faceNormals(p) {
  const P = p.position, I = p.index, N = new Float32Array(P.length);
  for (let t = 0; t < I.length; t += 3) {
    const a = I[t], b = I[t+1], c = I[t+2];
    const ax = P[b*3]-P[a*3], ay = P[b*3+1]-P[a*3+1], az = P[b*3+2]-P[a*3+2];
    const bx = P[c*3]-P[a*3], by = P[c*3+1]-P[a*3+1], bz = P[c*3+2]-P[a*3+2];
    const nx = ay*bz-az*by, ny = az*bx-ax*bz, nz = ax*by-ay*bx;
    for (const i of [a, b, c]) { N[i*3]+=nx; N[i*3+1]+=ny; N[i*3+2]+=nz; }
  }
  for (let i = 0; i < N.length; i += 3) {
    const l = Math.hypot(N[i], N[i+1], N[i+2]) || 1;
    N[i]/=l; N[i+1]/=l; N[i+2]/=l;
  }
  return N;
}

/**
 * UV islands: the pieces the pattern is actually cut into.
 *
 * Grouping by the index buffer looks equivalent and is not. Vertices get split
 * for hard shading edges as well as for UV seams, and every one of those splits
 * severs the index graph - this model reports 139 pieces that way, when it has
 * four. Welding by UV instead asks the question that was meant: do these
 * triangles sit next to each other on the flattened pattern?
 */
function islandLabels(p) {
  const n = p.position.length / 3, U = p.uv, I = p.index;
  const key = new Map(), wid = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    const k = Math.round(U[i*2]*8192) + ',' + Math.round(U[i*2+1]*8192);
    let w = key.get(k);
    if (w === undefined) { w = key.size; key.set(k, w); }
    wid[i] = w;
  }
  const par = new Int32Array(key.size);
  for (let i = 0; i < par.length; i++) par[i] = i;
  const find = a => { while (par[a] !== a) { par[a] = par[par[a]]; a = par[a]; } return a; };
  for (let t = 0; t < I.length; t += 3) {
    const a = find(wid[I[t]]);
    for (let k = 1; k < 3; k++) { const b = find(wid[I[t+k]]); if (b !== a) par[b] = a; }
  }
  const out = new Int32Array(n), seen = new Map();
  for (let i = 0; i < n; i++) {
    const r = find(wid[i]);
    if (!seen.has(r)) seen.set(r, seen.size);
    out[i] = seen.get(r);
  }
  return out;
}

/* ===========================================================================
   SECTION 3 - GL helpers
   =========================================================================== */
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', {antialias: true, alpha: false});
if (!gl) {
  document.getElementById('err').style.display = 'grid';
  document.getElementById('err').textContent =
    'This browser could not start WebGL 2.\n' +
    'Projection painting needs it. Try a current Chrome, Edge, Firefox or Safari.';
  document.getElementById('bar').style.display = 'none';
  return;
}

function program(vs, fs) {
  const c = (t, s) => {
    const o = gl.createShader(t);
    gl.shaderSource(o, '#version 300 es\n' + s);
    gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(o) + '\n' + s);
    return o;
  };
  const p = gl.createProgram();
  gl.attachShader(p, c(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, c(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'aPos');
  gl.bindAttribLocation(p, 1, 'aNrm');
  gl.bindAttribLocation(p, 2, 'aUV');
  gl.bindAttribLocation(p, 3, 'aLay');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = new Proxy({}, {get: (t, k) => (k in t ? t[k]
    : (t[k] = gl.getUniformLocation(p, k)))});
  return {p, u};
}

function tex2d(w, h, internal, format, type, filter) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter || gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter || gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function fbo(colour, depth) {
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  if (colour) gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
    gl.TEXTURE_2D, colour, 0);
  if (depth) gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT,
    gl.TEXTURE_2D, depth, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return f;
}
const quadVao = (() => {
  const v = gl.createVertexArray();
  gl.bindVertexArray(v);
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  return v;
})();

/* ===========================================================================
   SECTION 4 - PAINTER
   Depends only on: parts with position/normal/uv/index, and a camera.
   It has no idea what a t-shirt is.
   =========================================================================== */
const QUAD_VS = `in vec2 aPos; out vec2 vUV;
void main(){ vUV = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

// The whole trick: rasterise the mesh into UV space. Every texel then knows
// its own world position and normal, so a stroke never has to be walked across
// a UV seam - the seam simply does not exist in this pass.
const BAKE_VS = `
in vec3 aPos; in vec3 aNrm; in vec2 aUV; in vec2 aLay;
out vec3 vWP; out vec3 vWN; out vec2 vLay;
void main(){ vWP = aPos; vWN = aNrm; vLay = aLay;
  gl_Position = vec4(aUV*2.0-1.0, 0.0, 1.0); }`;

/* the metallic extension: remove this shader to take it out.
   Where each texel of the atlas sits on the garment. The fill writes texels
   straight out rather than going through the stamp, so it has no way to ask
   where it is - and a metallic fill came out flat. This is the same mesh drawn
   in atlas space that every bake uses. */
const WPOS_FS = `
precision highp float; in vec3 vWP;
uniform vec3 uWAt; uniform float uWSpan;
out vec4 o;
void main(){
  /* Kept as a fraction of the garment rather than raw metres, so eight bits a
     channel is ample: a garment is under a metre across, which leaves a step
     of a couple of millimetres. */
  o = vec4((vWP - uWAt)*uWSpan*0.5 + 0.5, 1.0);
}`;

const STAMP_FS = `
precision highp float;
in vec3 vWP; in vec3 vWN; in vec2 vLay;
uniform mat4 uViewProj;
uniform vec3 uEye;
uniform vec2 uScreen, uBrush;
uniform float uRadius, uHard, uFlow, uNear, uFar;
uniform float uBias, uBiasMax, uBiasLimit;
uniform vec2 uDepthTexel;
uniform float uMode;     // 0 = round brush, 1 = screen-space mask (fill)
uniform mat4 uViewProj2;
uniform vec3 uEye2;
uniform float uHasMirror;
/* How the mirrored pass joins the first. A stroke wants the larger of the two -
   the dab or its mirror. A mask that has been inverted wants the smaller:
   inverting "the region or its mirror" means "not the region and not its
   mirror", and taking the larger filled the cut back in. */
uniform float uPairMin;
uniform sampler2D uDepth2;
uniform sampler2D uDepth, uMask, uPhoto, uRamp, uStamp;
uniform mat2 uStampM;
uniform vec2 uStampC;
uniform vec3 uGradA, uGradDir;
uniform float uGradInv, uPlaneX;
uniform float uGhost;

/* ---- metallic, an extension ------------------------------------------------
   A sheen baked into the colour as it goes down, so what is painted is what
   prints. The direction belongs to the garment, not to the view: lit from the
   camera, the same stroke would come out differently depending on where you
   were standing. Nothing here runs unless uMetal is on. */
uniform float uMetal, uMetalTight, uMetalDark, uMetalSpan;
uniform vec3 uMetalDir, uMetalColour, uMetalAt;
vec3 gRGB = vec3(1.0);
out vec4 o;
float linear(float z){ float n = z*2.0-1.0;
  return (2.0*uNear*uFar)/(uFar+uNear-n*(uFar-uNear)); }

// A photo is a rectangle on the flattened pattern - the same thing Save texture
// writes out. This pass already rasterises into UV space, so a fragment's own
// atlas position IS its UV: nothing to project, nothing that has to be visible.
//
// It does mean the image is cut wherever the pattern is cut, and a piece that
// runs off the front panel reappears on whichever panel sits next to it in the
// atlas. That is a property of the layout, not of the placement, which is why
// the frame is now shown on the layout itself rather than over the model.
// Each vertex arrives already carrying where it sits in the image, worked out
// on the way in: straight from its own piece, or measured across the stitching
// that joins its piece to the one the image was dropped on. A vertex on a piece
// with no such join is sent far outside, so those pixels simply do not appear.
float photoDab(){
  vec2 l = vLay;
  if(any(greaterThan(abs(l), vec2(1.0)))) return 0.0;
  vec4 c = texture(uPhoto, (l + 1.0)*0.5);
  if(c.a <= 0.0) return 0.0;
  gRGB = c.rgb;
  return c.a*uFlow;
}

float footprint(vec2 scr){
  float d = distance(scr, uBrush);
  if(d > uRadius) return 0.0;
  // A hard edge cannot be a step: this pass runs per atlas texel, so a binary
  // test aliases. Hold the transition to about one texel via the derivative,
  // clamped because derivatives across a UV seam are noise.
  float aa = clamp(fwidth(d), 0.6, 3.0);
  return pow(clamp((uRadius-d)/max(uRadius*(1.0-uHard), aa), 0.0, 1.0),
             uHard > 0.95 ? 1.0 : 1.4);
}

// One dab, seen from one camera. Everything the brush does lives here, so the
// mirrored half can be produced by running exactly this again from a reflected
// camera - a real stroke on real geometry, not an approximation of one.
float dab(mat4 vp, vec3 eye, sampler2D dep, float mir){
  vec4 clip = vp*vec4(vWP, 1.0);
  if(clip.w <= 0.0) return 0.0;
  vec3 ndc = clip.xyz/clip.w;
  if(any(greaterThan(abs(ndc.xy), vec2(1.05)))) return 0.0;
  vec2 duv = ndc.xy*0.5 + 0.5;

  float shape;
  if(uMode < 0.5) shape = footprint(duv*uScreen);
  /* Bounded at the top, or the hard fill's mode 5 would be caught here first -
     the same way a stamp was once caught by the gradient's branch. */
  else if(uMode > 3.5 && uMode < 4.5){
    /* A stamp is a picture used as a shape, tested where the texel lands on
       screen - so it wraps over the surface the way the brush does, rather
       than being laid into the texture. It is still held to the one pattern
       piece the frame is over: every vertex is marked beforehand, and anything
       on another piece is dropped, so the shape stops at a seam.

       The mark rides in the same attribute the photo uses; only one of the two
       is ever being placed. */
    if(vLay.x > 8.0) return 0.0;
    vec2 l = uStampM*(duv*uScreen - uStampC);
    if(any(greaterThan(abs(l), vec2(1.0)))) return 0.0;
    vec4 sc = texture(uStamp, (l + 1.0)*0.5);
    shape = sc.a;
    /* The shape's texture is uploaded un-premultiplied, so its colour is
       already the colour it was drawn in. Dividing the alpha out again pushed
       it past one and everything downstream read the wrong depth. */
    gRGB = sc.rgb;
  }
  else shape = smoothstep(0.25, 0.6, texture(uMask, duv).r);
  if(shape <= 0.0) return 0.0;

  // A gradient has no shape of its own: it is a colour that depends on where a
  // point sits along a line, so it crosses seams and curves without any of the
  // trouble a picture has. The mirrored pass reflects the point rather than the
  // line, which comes to the same thing and costs one subtraction.
  /* The gradient only. A stamp is mode 4, which also passes "> 2.5", so this
     ran for stamps too and overwrote the shape's own colour with the ramp -
     whose first stop is the toolbar's colour, which is why every shape came out
     in it however the shape had been drawn. */
  if(uMode > 2.5 && uMode < 3.5){
    vec3 Q = mir > 0.5 ? vec3(2.0*uPlaneX - vWP.x, vWP.y, vWP.z) : vWP;
    // Only between the two ends. Past either of them there is no gradient, so
    // nothing is laid down rather than the end colour running on forever.
    float g = dot(Q - uGradA, uGradDir)*uGradInv;
    if(g < 0.0 || g > 1.0) return 0.0;
    vec4 cr = texture(uRamp, vec2(g, 0.5));
    gRGB = cr.rgb;
    shape *= cr.a;
    if(shape <= 0.0) return 0.0;
  }

  // facing: never paint a surface turned away from this camera
  vec3 N = normalize(vWN);
  vec3 V = normalize(eye - vWP);
  float f = dot(N, V);
  // Projected through the garment, the far side is lit from behind, so judge
  // it on how square-on it is rather than which way it points.
  // A wrap is a mapping, not a view: every texel it covers belongs to it,
  // front, back and all the way round.
  if(uMode < 1.5 && f <= 0.05) return 0.0;   // not the hard fill: it is mode 5

  // Occlusion. The error to cover is "how much depth does one pixel of the
  // depth map span here", so measure it rather than guess it from the surface
  // slope: read the depth map's own local gradient. It is in the same units as
  // the depth, so it needs no scale factor - which is where the mottled-
  // fingerprint bug came from when a constant tuned for a metre-sized mesh met
  // a centimetre-unit import.
  float scene = linear(texture(dep, duv).r);
  float grad = 0.0;
  for(int k = 0; k < 4; k++){
    vec2 o2 = vec2(k == 0 ? 1.0 : k == 1 ? -1.0 : 0.0,
                   k == 2 ? 1.0 : k == 3 ? -1.0 : 0.0)*uDepthTexel;
    float df = abs(linear(texture(dep, duv + o2).r) - scene);
    // a neighbour jumping this far is a silhouette or the background, not this
    // surface, and must not set the tolerance
    if(df < uBiasLimit) grad = max(grad, df);
  }
  // Skipped when projecting through: reaching the back of the garment is the
  // whole point, and the depth test exists to stop exactly that.
  if(uMode < 1.5 &&
     linear(ndc.z*0.5 + 0.5) > scene + min(grad*1.5 + uBias, uBiasMax)) return 0.0;

  // A stroke fades as the surface turns away so grazing angles do not smear.
  // A fill must not: it means "this region is this colour".
  float fade = uMode < 0.5 ? clamp((f - 0.03)/0.12, 0.0, 1.0) : 1.0;
  return shape*uFlow*fade;
}

void main(){
  float a;
  if(uMode > 1.5 && uMode < 2.5){
    a = photoDab();
  } else {
    a = dab(uViewProj, uEye, uDepth, 0.0);
    // Reflecting the camera puts the mirrored dab on real geometry with real
    // visibility, so an asymmetric model is no longer a special case.
    if(uHasMirror > 0.5) {
    float a2 = dab(uViewProj2, uEye2, uDepth2, 1.0);
    a = uPairMin > 0.5 ? min(a, a2) : max(a, a2);
  }
  }
  if(a <= 0.0) discard;
  // brush and fill carry one colour applied at composite time; a photo brings
  // its own, so it travels premultiplied through the stroke buffer
  /* A stamp carries no colour of its own - it is a shape, and the colour comes
     from the toolbar at the moment it is put down, the same way the brush and
     the fill take theirs. So it writes coverage only and lets the compositing
     step apply the colour, rather than a colour it never had. */
  /* A stamp carries the colours it was drawn in, so it goes down as it looked
     on the pad. Only the fill mask and the brush take the current colour. */
  /* the metallic extension: remove this block to take it out */
  if(uMetal > 0.5){
    vec3 base = uMode < 1.5 ? uMetalColour : gRGB;
    /* A band running across the garment, not something its shape produces. The
       front of a shirt is nearly flat, so a sheen taken from the normal alone
       put the whole stroke at one value and came out a single colour. In print
       the sheen is a band across the artwork, so it follows the position along
       the light direction; the normal only shades it. */
    float t = dot(vWP - uMetalAt, uMetalDir)*uMetalSpan;
    /* A soft falloff rather than a hard edge, so the whole garment shades
       instead of one narrow strip on an otherwise flat colour. */
    float band = exp(-t*t*uMetalTight*0.35);
    float sheen = band;
    float lit = 0.45 + 0.55*max(dot(normalize(vWN), uMetalDir), 0.0);
    vec3 body = mix(base*uMetalDark, base, lit);
    gRGB = mix(body, mix(base, vec3(1.0), 0.8), sheen*0.9);
  }
  // the metallic extension: the uMetal test keeps a plain stroke alpha-only
  o = (uMode < 1.5 && uMetal < 0.5) ? vec4(a) : vec4(gRGB*a, a);
}`;

// Coverage + existing paint, from the camera. The flood fill runs on this in
// screen space, which is what lets a fill cross a UV seam: seams do not exist
// in screen space, only in the atlas.
const FILL_VS = `in vec3 aPos; in vec3 aNrm; in vec2 aUV;
uniform mat4 uViewProj; out vec2 vUV;
void main(){ vUV = aUV; gl_Position = uViewProj*vec4(aPos,1.0); }`;
const FILL_FS = `precision highp float; in vec2 vUV;
uniform sampler2D uPaint; uniform vec2 uTexel; out vec4 o;
void main(){
  // Widest of a 3x3 atlas neighbourhood, not a point sample. This buffer is
  // coarser than the canvas, so a one-texel outline would otherwise alias into
  // gaps and the fill would leak straight through it.
  float a = 0.0;
  for(int j = -1; j <= 1; j++)
    for(int i = -1; i <= 1; i++)
      a = max(a, texture(uPaint, vUV + vec2(float(i), float(j))*uTexel).a);
  o = vec4(a, 1.0, 0.0, 1.0);
}`;

const DEPTH_VS = `in vec3 aPos; uniform mat4 uViewProj;
void main(){ gl_Position = uViewProj*vec4(aPos,1.0); }`;
const EMPTY_FS = `precision highp float; out vec4 o; void main(){ o = vec4(1.0); }`;

const COMPOSITE_FS = `
precision highp float; in vec2 vUV;
uniform sampler2D uStroke, uWas; uniform vec3 uColour;
uniform float uOpacity, uStrokeIsPhoto, uAbut;
out vec4 o;
void main(){
  vec4 s = texture(uStroke, vUV);
  o = uStrokeIsPhoto > 0.5 ? s*uOpacity : vec4(uColour*s.a*uOpacity, s.a*uOpacity);

  /* Where two opaque strokes meet, each is anti-aliased against the cloth and
     nothing joins them: a texel half covered by one and half by the other came
     out three-quarters covered, with the cloth showing through the seam and the
     later colour winning. The new stroke takes whatever it covers and the old
     paint keeps what is left of what it had, which is right both at a seam and
     where one stroke lands on another. */
  if(uAbut > 0.5){
    vec4 w = texture(uWas, vUV);
    float keep = min(w.a, 1.0 - o.a);
    float a = min(1.0, keep + o.a);
    vec3 lay = o.a > 0.0 ? o.rgb/o.a : vec3(0.0);
    vec3 had = w.a > 0.0 ? w.rgb/w.a : vec3(0.0);
    vec3 c = a > 0.0 ? (lay*o.a + had*keep)/a : vec3(0.0);
    o = vec4(c*a, a);
  }
}`;   // premultiplied, so blending is a plain "over"

/* the alternative fill: remove this shader to take it out.
   Step one on its own: decide for every texel whether it is more than half
   covered and make it wholly in or wholly out. Nothing is filled - this only
   shows what the hard-edged picture looks like. */
/* the alternative fill: remove this shader to take it out.
   Where in the atlas a point on screen lands. With that, the whole fill can be
   done in the atlas - one space, no resampling, so the hardening survives. */
const UVAT_FS = `precision highp float; in vec2 vUV;
out vec4 o;
void main(){ o = vec4(vUV, 0.0, 1.0); }`;

const DILATE_FS = `
precision highp float; in vec2 vUV;
uniform sampler2D uPaint, uMask; uniform vec2 uTexel; uniform float uRadius;
out vec4 o;
void main(){
  vec4 c = texture(uPaint, vUV);
  // Only fill the gutter between islands. Bleeding into covered-but-unpainted
  // texels would fatten every stroke; leaving the gutter empty makes each
  // island edge sample white and every seam show as a hairline.
  if(c.a > 0.002 || texture(uMask, vUV).r > 0.5){ o = c; return; }
  vec4 acc = vec4(0.0); float n = 0.0;
  for(float r = 1.0; r <= 6.0; r += 1.0){
    if(r > uRadius) break;
    for(float k = 0.0; k < 12.0; k += 1.0){
      float ang = k*0.5235988;
      vec4 s = texture(uPaint, vUV + vec2(cos(ang), sin(ang))*r*uTexel);
      if(s.a > 0.002){ acc += s; n += 1.0; }
    }
    if(n > 0.0) break;
  }
  o = n > 0.0 ? acc/n : c;
}`;

// Writing an image back into the paint layer. Done as a draw rather than a
// canvas upload so any source size scales cleanly, and so the premultiply and
// the V flip are explicit instead of relying on unpack flags.
const IMPORT_FS = `
precision highp float; in vec2 vUV;
uniform sampler2D uSrc; uniform float uFlip;
out vec4 o;
void main(){
  // OBJ measures V from the bottom of the image, glTF from the top. The export
  // matched the source file, so the import has to undo the same thing.
  vec2 uv = vec2(vUV.x, uFlip > 0.5 ? 1.0 - vUV.y : vUV.y);
  vec4 c = texture(uSrc, uv);
  o = vec4(c.rgb*c.a, c.a);      // the paint layer is stored premultiplied
}`;

const MASK_FS = `precision highp float; out vec4 o; void main(){ o = vec4(1.0); }`;

class Painter {
  constructor(mesh, size) {
    this.mesh = mesh;
    this.size = size;
    const layBufs = [];
    this.vaos = mesh.parts.map(p => {
      const v = gl.createVertexArray();
      gl.bindVertexArray(v);
      const mk = (data, loc, n) => {
        const b = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, n, gl.FLOAT, false, 0, 0);
      };
      mk(p.position, 0, 3); mk(p.normal, 1, 3); mk(p.uv, 2, 2);
      // where each vertex lands in the image; rewritten whenever it moves
      const lay = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, lay);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array((p.position.length/3)*2),
        gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(3);
      gl.vertexAttribPointer(3, 2, gl.FLOAT, false, 0, 0);
      layBufs.push(lay);
      const ib = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
      let idx = p.index, type = gl.UNSIGNED_INT;
      if (p.position.length / 3 <= 65535) { idx = new Uint16Array(p.index); type = gl.UNSIGNED_SHORT; }
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
      gl.bindVertexArray(null);
      return {vao: v, count: idx.length, type};
    });
    this.layBufs = layBufs;

    const S = size;
    this.paint  = tex2d(S, S, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
    this.disp   = tex2d(S, S, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
    this.stroke = tex2d(S, S, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
    this.mask   = tex2d(S, S, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.NEAREST);
    this.fPaint = fbo(this.paint); this.fDisp = fbo(this.disp);
    this.fStroke = fbo(this.stroke); this.fMask = fbo(this.mask);

    this.fs = 0;
    this.maskTex = tex2d(4, 4, gl.R8, gl.RED, gl.UNSIGNED_BYTE);
    // the gradient's colours, laid out along one row and read by position
    this.rampTex = tex2d(256, 1, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR);
    this.stampTex = tex2d(4, 4, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR);
    // A finer depth map narrows the gradient everywhere, which is what the
    // tolerance is made of; 16 MB is a fair trade for it.
    /* The depth map and the undo ring are the two biggest allocations here, and
       on a phone they were the wrong way round: the depth map stayed at 2048
       however small the atlas, and the ring kept MORE snapshots on the small
       atlas than on the large one. Both follow the device now - iOS drops the
       whole context rather than paging, so the ceiling matters. */
    this.dw = this.dh = touch ? 1024 : 2048;
    this.depthTex = tex2d(this.dw, this.dh, gl.DEPTH_COMPONENT24,
      gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, gl.NEAREST);
    this.fDepth = fbo(null, this.depthTex);
    this.depthTex2 = tex2d(this.dw, this.dh, gl.DEPTH_COMPONENT24,
      gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, gl.NEAREST);
    this.fDepth2 = fbo(null, this.depthTex2);

    this.pStamp = program(BAKE_VS, STAMP_FS);
    // the metallic extension: remove this line to take it out
    this.pWPos = program(BAKE_VS, WPOS_FS);
    this.pDepth = program(DEPTH_VS, EMPTY_FS);
    this.pComp  = program(QUAD_VS, COMPOSITE_FS);
    this.pDil   = program(QUAD_VS, DILATE_FS);
    this.pMask  = program(BAKE_VS, MASK_FS);
    this.pFill  = program(FILL_VS, FILL_FS);
    // the alternative fill: remove this line to take it out
    this.pUvAt  = program(FILL_VS, UVAT_FS);
    this.pImp   = program(QUAD_VS, IMPORT_FS);

    this.undoRing = []; this.undoAt = -1; this.redoAvail = 0;
    this.UNDO_MAX = touch ? 4 : (size >= 2048 ? 5 : 10);

    this.bakeMask();
    this.clear();
  }

  drawMesh() {
    for (const v of this.vaos) {
      gl.bindVertexArray(v.vao);
      gl.drawElements(gl.TRIANGLES, v.count, v.type, 0);
    }
    gl.bindVertexArray(null);
  }

  bakeMask() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fMask);
    gl.viewport(0, 0, this.size, this.size);
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(this.pMask.p);
    this.drawMesh();
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  clear() {
    for (const f of [this.fPaint, this.fDisp, this.fStroke]) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, f);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.undoRing.forEach(t => gl.deleteTexture(t));
    this.undoRing = []; this.undoAt = -1; this.redoAvail = 0;
  }

  snapshot() {
    const t = tex2d(this.size, this.size, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
    const f = fbo(t);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, this.fPaint);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, f);
    gl.blitFramebuffer(0, 0, this.size, this.size, 0, 0, this.size, this.size,
      gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
    gl.deleteFramebuffer(f);
    return t;
  }
  restore(t) {
    const f = fbo(t);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, f);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, this.fPaint);
    gl.blitFramebuffer(0, 0, this.size, this.size, 0, 0, this.size, this.size,
      gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
    gl.deleteFramebuffer(f);
    this.dilate();
  }

  beginStroke(cam, colour, opacity, erase, isPhoto, under) {
    /* the metallic extension: `|| metalOn` makes a metallic stroke carry its
       own colour, since the sheen differs from texel to texel. */
    this.cur = {colour, opacity, erase, isPhoto: !!isPhoto || metalOn,
                under: !!under};
    // drop any redo branch, then remember the state we are about to change
    while (this.undoRing.length > this.undoAt + 1) gl.deleteTexture(this.undoRing.pop());
    this.undoRing.push(this.snapshot());
    while (this.undoRing.length > this.UNDO_MAX) gl.deleteTexture(this.undoRing.shift());
    this.undoAt = this.undoRing.length - 1;
    this.redoAvail = 0;

    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fStroke);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.depthPass(cam);
  }

  depthOnce(f, vp) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.drawBuffers([gl.NONE]); gl.readBuffer(gl.NONE);
    gl.viewport(0, 0, this.dw, this.dh);
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS); gl.disable(gl.BLEND);
    gl.disable(gl.CULL_FACE);          // the mirrored matrix reverses winding
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.useProgram(this.pDepth.p);
    gl.uniformMatrix4fv(this.pDepth.u.uViewProj, false, vp);
    this.drawMesh();
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  depthPass(cam) {
    this.depthOnce(this.fDepth, cam.viewProj);
    // the mirrored camera needs its own view of what is in front of what
    if (cam.viewProj2) this.depthOnce(this.fDepth2, cam.viewProj2);
    this.cam = cam;
  }

  clearStroke() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fStroke);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // The fill prescan has to resolve the thinnest line the user can draw, so it
  // tracks the canvas rather than sitting at a fixed low resolution.
  ensureFill(want) {
    const S = Math.max(768, Math.min(1400, want));
    if (S === this.fs) return;
    for (const t of [this.fillTex, this.fillDepth]) if (t) gl.deleteTexture(t);
    if (this.fFill) gl.deleteFramebuffer(this.fFill);
    this.fs = S;
    this.fillTex = tex2d(S, S, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.NEAREST);
    this.fillDepth = tex2d(S, S, gl.DEPTH_COMPONENT24,
      gl.DEPTH_COMPONENT, gl.UNSIGNED_INT, gl.NEAREST);
    this.fFill = fbo(this.fillTex, this.fillDepth);
    gl.deleteTexture(this.maskTex);
    this.maskTex = tex2d(S, S, gl.R8, gl.RED, gl.UNSIGNED_BYTE);
  }

  /* The image coordinate of every vertex, replaced whenever the frame moves. */
  setLayout(lay) {
    if (!lay) return;
    for (let i = 0; i < this.layBufs.length; i++) {
      gl.bindBuffer(gl.ARRAY_BUFFER, this.layBufs[i]);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, lay[i]);
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, null);
  }

  /* The shape being stamped, kept as coverage only. */
  setStamp(src) {
    gl.bindTexture(gl.TEXTURE_2D, this.stampTex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, src);
    for (const q of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER])
      gl.texParameteri(gl.TEXTURE_2D, q, gl.LINEAR);
    for (const q of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T])
      gl.texParameteri(gl.TEXTURE_2D, q, gl.CLAMP_TO_EDGE);
  }

  /* The gradient's colours, sampled into one row of pixels. */
  setRamp(px) {
    gl.bindTexture(gl.TEXTURE_2D, this.rampTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 256, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
  }

  /* Every visible surface, for a gradient with no mask drawn round it. */
  fillMaskAll() {
    const S = this.fs;
    const px = new Uint8Array(S*S).fill(255);
    gl.bindTexture(gl.TEXTURE_2D, this.maskTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, S, S, gl.RED, gl.UNSIGNED_BYTE, px);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
  }

  /* A polygon the user drew, as the region to fill.
     The mask is read the same way the fill prescan writes it, and readPixels
     hands back rows from the bottom up. The polygon arrives measured from the
     top of the screen, so the rows are counted the other way round; without
     that the paint landed as a mirror image of the shape drawn. */
  setMaskPolygon(polys, invert) {
    const S = this.fs, out = new Uint8Array(S*S);

    /* A stamped shape joins the mask the same way a drawn outline does: its
       coverage is read where each cell of the mask lands on screen. Rows here
       run bottom-up, matching the fill's own prescan. */
    for (const st of polys) {
      if (!st || !st.stamp) continue;
      const {c, m} = st.stamp, A = st.alpha, N = st.n;
      /* Judged against the shape's own strongest ink. A shape drawn faintly
         peaks well below any fixed half, so a fixed one would let it make no
         mask at all. */
      let top = 0;
      for (let i = 3; i < A.length; i += 4) if (A[i] > top) top = A[i];
      const cut = Math.max(1, top*0.5);
      const dpr = Math.min(devicePixelRatio || 1, 2);
      const W = cv.clientWidth, H = cv.clientHeight;
      for (let y = 0; y < S; y++) {
        const sy = cv.height - (S - (y + 0.5))/S*H*dpr;
        for (let x = 0; x < S; x++) {
          const sx = (x + 0.5)/S*W*dpr;
          const dx = sx - c[0], dy = sy - c[1];
          const lx = m[0]*dx + m[2]*dy, ly = m[1]*dx + m[3]*dy;
          if (lx < -1 || lx > 1 || ly < -1 || ly > 1) continue;
          /* The same lookup the shader does - (l+1)/2 straight through. An
             extra flip here turned every stamped mask upside down, which a
             symmetrical test shape could never have shown. */
          const u = ((lx + 1)*0.5*N) | 0, v = ((ly + 1)*0.5*N) | 0;
          if (A[(Math.min(N-1, v)*N + Math.min(N-1, u))*4 + 3] >= cut)
            out[y*S + x] = 255;
        }
      }
    }

    for (const pts of polys) {
      if (!Array.isArray(pts)) continue;
      const n = pts.length;
      if (n < 3) continue;
      // crossing rule within a shape, union across them
      for (let y = 0; y < S; y++) {
        const py = S - (y + 0.5);
        const xs = [];
        for (let i = 0, j = n-1; i < n; j = i++) {
          const a = pts[j], b = pts[i];
          if ((a[1] > py) === (b[1] > py)) continue;
          xs.push(a[0] + (py - a[1])/(b[1] - a[1])*(b[0] - a[0]));
        }
        xs.sort((p, q) => p - q);
        for (let k = 0; k + 1 < xs.length; k += 2) {
          const x0 = Math.max(0, Math.ceil(xs[k] - 0.5));
          const x1 = Math.min(S-1, Math.floor(xs[k+1] - 0.5));
          for (let x = x0; x <= x1; x++) out[y*S + x] = 255;
        }
      }
    }
    if (invert) for (let i = 0; i < out.length; i++) out[i] = 255 - out[i];
    /* Not grown. Hardening squares an edge but keeps a stroke's own strength -
       a line drawn at a third stays at a third, not solid - so reaching the
       fill over it lays a second coat and the two read deeper. And it was never
       needed: read cell by cell, every texel falls in exactly one mask cell,
       so none can be missed between two. */

    gl.bindTexture(gl.TEXTURE_2D, this.maskTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, S, S, gl.RED, gl.UNSIGNED_BYTE, out);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
  }

  importTexture(src, flipV) {
    this.undoRing.push(this.snapshot());
    while (this.undoRing.length > this.UNDO_MAX) gl.deleteTexture(this.undoRing.shift());
    this.undoAt = this.undoRing.length - 1;
    this.redoAvail = 0;

    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, src);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fPaint);
    gl.viewport(0, 0, this.size, this.size);
    gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
    gl.useProgram(this.pImp.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.uniform1i(this.pImp.u.uSrc, 0);
    gl.uniform1f(this.pImp.u.uFlip, flipV ? 1 : 0);
    gl.bindVertexArray(quadVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteTexture(t);
    this.dilate();
  }

  cancelStroke() {
    const t = this.undoRing.pop();
    if (t) gl.deleteTexture(t);
    this.undoAt = this.undoRing.length - 1;
    this.clearStroke();
  }

  // Flood fill the visible surface from a click, stopping at existing paint.
  // Returns false when the seed is not on the model or is already painted.

  /* the alternative fill: remove this method to take it out.
     All of it in the atlas, which is the only place the hardening is real.
     Going out to the screen and back resamples three times over - the paint is
     read blended, the mask is a different size again, and each step turns a
     square edge back into a ramp. Here a texel is what it is: painted or bare,
     nothing between, and the fill takes every bare one it can reach. */
  /* Which texel a point on screen lands on, seen through a given camera. The
     mirrored half is reached by asking through the reflected one, which is how
     every other tool produces its mirror image. */
  texelUnder(sx, sy, vp) {
    const c = this.cam;
    this.ensureFill(Math.max(c.width, c.height));
    const F = this.fs;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fFill);
    gl.viewport(0, 0, F, F);
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);
    gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(this.pUvAt.p);
    gl.uniformMatrix4fv(this.pUvAt.u.uViewProj, false, vp);
    this.drawMesh();
    const at = new Uint8Array(4);
    const fx = Math.round(sx / c.width * F), fy = Math.round(sy / c.height * F);
    if (fx < 0 || fy < 0 || fx >= F || fy >= F) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      return -1;
    }
    gl.readPixels(fx, fy, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, at);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (at[3] === 0) return -1;                    // nothing under the press
    const S = this.size;
    return Math.min(S-1, Math.round(at[1]/255*S))*S
         + Math.min(S-1, Math.round(at[0]/255*S));
  }

  /* the metallic extension: remove this method to take it out.
     The world place of every texel, so a fill can shade itself the way the
     stamp does. Drawn into the display buffer, which is free at this point. */
  worldMap() {
    const S = this.size;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fDisp);
    gl.viewport(0, 0, S, S);
    gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(this.pWPos.p);
    gl.uniform3fv(this.pWPos.u.uWAt,
      new Float32Array(mesh ? mesh.centre : [0, 0, 0]));
    gl.uniform1f(this.pWPos.u.uWSpan, mesh ? 1/(mesh.radius*1.2) : 1);
    this.drawMesh();
    const out = new Uint8Array(S*S*4);
    gl.readPixels(0, 0, S, S, gl.RGBA, gl.UNSIGNED_BYTE, out);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    this.dilate();
    return out;
  }

  fillHardAt(sx, sy) {
    const c = this.cam;
    const S = this.size;

    /* Both halves when the mirror is on, the same way a stroke gets its pair:
       the reflected camera says which texel the mirrored point lands on. */
    const seeds = [this.texelUnder(sx, sy, c.viewProj)];
    if (this.mirrored && c.viewProj2)
      seeds.push(this.texelUnder(sx, sy, c.viewProj2));

    // the atlas as it stands
    const px = new Uint8Array(S*S*4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fPaint);
    gl.readPixels(0, 0, S, S, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    const start = seeds.filter(i => i >= 0 && px[i*4 + 3] === 0);
    if (!start.length) return false;

    /* Hardened on a working copy, not on the picture. Every texel is counted as
       wholly the line or wholly bare, which is what decides where the fill
       stops - but the picture itself is only written where the fill lands, so
       the far side of a line is left exactly as it was drawn. */
    const solid = aliasWall(S, i => px[i*4 + 3]);

    // every texel the fill can reach, counting a part-covered one as bare
    const out = fillRegion(S, start, solid);

    const col = this.cur.colour;
    const r = Math.round(col[0]*255), g = Math.round(col[1]*255),
          b = Math.round(col[2]*255);
    const alpha = Math.round(Math.max(0.02, this.cur.opacity)*255);
    /* the metallic extension: the same sheen a stroke gets, asked for at each
       texel's own place - writing one flat colour made a metallic fill look
       painted on. */
    const wm = metalOn ? this.worldMap() : null;
    const dir = metalDir();
    const sp = mesh ? mesh.radius*1.2 : 1;
    const inkAt = i => {
      const t = ((wm[i*4]/255 - 0.5)*2*sp*dir[0]
               + (wm[i*4+1]/255 - 0.5)*2*sp*dir[1]
               + (wm[i*4+2]/255 - 0.5)*2*sp*dir[2]) / (mesh ? mesh.radius*0.9 : 1);
      return metalInk(col, metalSheen(t)).map(v => Math.round(v*255));
    };
    /* Premultiplied, as everything in the atlas is. Written straight, the
       colour reads at one over its own strength too bright, and the bleed into
       the gutter spreads that outward as a glow. */
    const f = alpha/255;
    for (let i = 0; i < S*S; i++) {
      if (!out[i]) continue;
      const [r2, g2, b2] = wm ? inkAt(i) : [r, g, b];
      px[i*4] = Math.round(r2*f); px[i*4+1] = Math.round(g2*f);
      px[i*4+2] = Math.round(b2*f); px[i*4+3] = alpha;
    }

    /* The rim where the fill meets ink, settled one way or the other - see
       settleRim. */
    const share = settleRim(S, out, i => px[i*4 + 3], i => {
      const a2 = px[i*4 + 3], k = 255/a2;     // its own colour, at full strength
      px[i*4] = Math.min(255, Math.round(px[i*4]*k));
      px[i*4+1] = Math.min(255, Math.round(px[i*4+1]*k));
      px[i*4+2] = Math.min(255, Math.round(px[i*4+2]*k));
      px[i*4+3] = 255;
    });

    /* One pass of anti-aliasing between the two colours, and only one. Every
       rim cell now stands at full strength, so the edge between the fill and
       the outline is hard and jagged; each of those cells is given back exactly
       the share of ink it held before, with the fill making up the rest. A
       cell that was three quarters outline comes out three quarters outline.
       Mixing while filling and then softening on top blended the same boundary
       twice and spread it over several cells, which is what reads as a ring. */
    const soft = new Uint8Array(px);
    for (let i = 0; i < S*S; i++) {
      const w = share[i];
      if (!w || w >= 1) continue;
      const [r2, g2, b2] = wm ? inkAt(i) : [r, g, b];
      soft[i*4]   = Math.round(px[i*4]  *w + r2*f*(1-w));
      soft[i*4+1] = Math.round(px[i*4+1]*w + g2*f*(1-w));
      soft[i*4+2] = Math.round(px[i*4+2]*w + b2*f*(1-w));
      soft[i*4+3] = Math.round(255*w + alpha*(1-w));
    }

    gl.bindTexture(gl.TEXTURE_2D, this.paint);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, S, S, gl.RGBA, gl.UNSIGNED_BYTE, soft);
    this.dilate();
    return true;
  }

  buildFillMask(sx, sy) {
    const c = this.cam;
    this.ensureFill(Math.max(c.width, c.height));
    const S = this.fs;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fFill);
    gl.viewport(0, 0, S, S);
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);
    gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(this.pFill.p);
    gl.uniformMatrix4fv(this.pFill.u.uViewProj, false, c.viewProj);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.paint);
    /* Read the paint texel by texel. Blended between texels, a hardened edge
       arrives here as a ramp again - and a ramp pixel is neither the line nor
       bare, which is what left cells to fill that were already the line. */
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.uniform1i(this.pFill.u.uPaint, 0);
    gl.uniform2f(this.pFill.u.uTexel, 1/this.size, 1/this.size);
    this.drawMesh();
    const px = new Uint8Array(S * S * 4);
    gl.readPixels(0, 0, S, S, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindTexture(gl.TEXTURE_2D, this.paint);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    const cx = Math.round(sx / c.width * S), cy = Math.round(sy / c.height * S);
    if (cx < 0 || cy < 0 || cx >= S || cy >= S) return false;
    const seed = cy * S + cx;
    if (px[seed * 4 + 1] < 128) return false;          // not on the model
    /* Any paint at all stops the spread, however faint. A threshold of 90 meant
       a line drawn below about 35% strength read as bare cloth and the fill
       walked straight through it - the growing below is what keeps the edge
       from showing, so no tolerance is needed here. */
    const LIMIT = 1;
    if (px[seed * 4] >= LIMIT) return false;

    const spread = floodFrom(seed, S, S,
      j => px[j*4 + 1] >= 128 && px[j*4] < LIMIT);
    const out = spread.out;
    let bx0 = spread.x0, bx1 = spread.x1, by0 = spread.y0, by1 = spread.y1;
    // The fill stops where paint is already solid, which leaves its edge sitting
    // just inside the outline. Growing it a couple of pixels tucks it under the
    // outline instead, so no pale ring survives between the two.
    /* Grown a few pixels past its edge so it reaches under the outline's soft
       inner rim; stopping short of it left a pale ring between the two. The
       doubling that used to cause is handled where the stroke is composited:
       a fill takes the deeper of itself and what is already there, so the
       overlap reads as one coat rather than two. */
    /* The same climb on the cloth: only ever to a texel with more paint than
       the one before, so a stroke can be tucked under but never crossed. */
    for (let more = true; more; ) {
      more = false;
      const src = out.slice();
      for (let y = 1; y < S-1; y++) for (let x = 1; x < S-1; x++) {
        const i = y*S + x;
        if (src[i] || px[i*4+1] < 128) continue;
        const here = px[i*4];
        let rising = false;
        for (const j of [i-1, i+1, i-S, i+S])
          if (px[j*4] > here + 2) { rising = true; break; }
        if (!rising) continue;
        for (const j of [i-1, i+1, i-S, i+S])
          if (src[j] && here > px[j*4] + 2) { out[i] = 255; more = true; break; }
      }
    }
    /* Not grown. Hardening squares an edge but keeps a stroke's own strength -
       a line drawn at a third stays at a third, not solid - so reaching the
       fill over it lays a second coat and the two read deeper. And it was never
       needed: read cell by cell, every texel falls in exactly one mask cell,
       so none can be missed between two. */

    gl.bindTexture(gl.TEXTURE_2D, this.maskTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, S, S, gl.RED, gl.UNSIGNED_BYTE, out);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
    return true;
  }

  // one dab. A stroke is many of these walked along the pointer path.
  stamp(x, y, radius, hard, flow, opts) {
    /* A preview is drawn without beginning a stroke, so it brings its own
       camera. Falling back on the last stroke's meant a preview drew nothing at
       all until something had been committed. */
    const c = (opts && opts.cam) || this.cam, P = this.pStamp;
    if (!c) return;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fStroke);
    gl.viewport(0, 0, this.size, this.size);
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
    const O = opts || {};
    if (O.photo) {
      // a photo lands in one pass and carries its own colour, so MAX would
      // mangle it; write straight into the stroke buffer instead
      gl.disable(gl.BLEND);
    } else {
      // MAX blending: overlapping dabs inside one stroke must not build up
      gl.enable(gl.BLEND);
      gl.blendEquation(gl.MAX);
      gl.blendFunc(gl.ONE, gl.ONE);
    }
    gl.useProgram(P.p);
    gl.uniformMatrix4fv(P.u.uViewProj, false, c.viewProj);
    gl.uniform3fv(P.u.uEye, c.eye);
    gl.uniform2f(P.u.uScreen, c.width, c.height);
    gl.uniform2f(P.u.uBrush, x, y);
    gl.uniform1f(P.u.uRadius, radius);
    gl.uniform1f(P.u.uHard, hard);
    gl.uniform1f(P.u.uFlow, flow);
    gl.uniform1f(P.u.uNear, c.near);
    gl.uniform1f(P.u.uFar, c.far);
    gl.uniform1f(P.u.uBias, c.bias);
    gl.uniform1f(P.u.uBiasMax, c.biasMax);
    gl.uniform1f(P.u.uBiasLimit, c.biasLimit);
    gl.uniform2f(P.u.uDepthTexel, 1/this.dw, 1/this.dh);
    gl.uniform1f(P.u.uMode, O.stamp ? 4 : O.grad ? 3 : O.photo ? 2 : O.mask ? 1 : 0);
    if (O.stamp) {
      gl.uniform2f(P.u.uStampC, O.stamp.c[0], O.stamp.c[1]);
      gl.uniformMatrix2fv(P.u.uStampM, false, O.stamp.m);
      gl.activeTexture(gl.TEXTURE6);
      gl.bindTexture(gl.TEXTURE_2D, this.stampTex);
      gl.uniform1i(P.u.uStamp, 6);
    }
    gl.uniform1f(P.u.uPlaneX, planeX || 0);
    if (O.grad) {
      gl.uniform3fv(P.u.uGradA, O.grad.a);
      gl.uniform3fv(P.u.uGradDir, O.grad.dir);
      gl.uniform1f(P.u.uGradInv, O.grad.inv);
      gl.activeTexture(gl.TEXTURE5);
      gl.bindTexture(gl.TEXTURE_2D, this.rampTex);
      gl.uniform1i(P.u.uRamp, 5);
    }
    if (O.photo) {
      gl.uniform1f(P.u.uGhost, O.photo.ghost ? 1 : 0);
      this.setLayout(O.photo.lay);
      gl.activeTexture(gl.TEXTURE3);
      gl.bindTexture(gl.TEXTURE_2D, O.photo.tex);
      gl.uniform1i(P.u.uPhoto, 3);
    }
    const useMirror = !!(O.mirror && c.viewProj2);
    gl.uniform1f(P.u.uHasMirror, useMirror ? 1 : 0);
    gl.uniform1f(P.u.uPairMin, O.pairMin ? 1 : 0);
    /* the metallic extension: remove these six lines to take it out */
    const mt = metalOn ? metal : null;
    gl.uniform1f(P.u.uMetal, mt ? 1 : 0);
    gl.uniform1f(P.u.uMetalTight, mt ? mt.tight : 1);
    gl.uniform1f(P.u.uMetalDark, mt ? mt.dark : 1);
    gl.uniform3fv(P.u.uMetalDir, mt ? metalDir() : new Float32Array([0, 1, 0]));
    // where the band sits, and how wide it is, in the garment's own units
    gl.uniform3fv(P.u.uMetalAt,
      new Float32Array(mesh ? mesh.centre : [0, 0, 0]));
    gl.uniform1f(P.u.uMetalSpan, mesh ? 1/(mesh.radius*0.9) : 1);
    gl.uniform3fv(P.u.uMetalColour,
      new Float32Array(this.cur && this.cur.colour ? this.cur.colour : [1, 1, 1]));
    if (useMirror) {
      gl.uniformMatrix4fv(P.u.uViewProj2, false, c.viewProj2);
      gl.uniform3fv(P.u.uEye2, c.eye2);
    }
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, this.depthTex2);
    gl.uniform1i(P.u.uDepth2, 2);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.depthTex);
    gl.uniform1i(P.u.uDepth, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, this.maskTex);
    gl.uniform1i(P.u.uMask, 1);
    this.drawMesh();
    gl.blendEquation(gl.FUNC_ADD);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  endStroke() {
    const P = this.pComp;
    /* An opaque stroke joins what is already there rather than being laid over
       it, which needs the old paint readable while the new is written - so it
       goes to the spare buffer and is moved back. A translucent one is laid
       over as before: a wash is meant to show what is under it. */
    const abut = !this.cur.erase && !this.cur.under
      && !this.cur.isPhoto && this.cur.opacity >= 0.999;
    gl.bindFramebuffer(gl.FRAMEBUFFER, abut ? this.fDisp : this.fPaint);
    gl.viewport(0, 0, this.size, this.size);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendEquation(gl.FUNC_ADD);
    if (this.cur.erase) gl.blendFunc(gl.ZERO, gl.ONE_MINUS_SRC_ALPHA);
    /* The same on the cloth: a fill colours in the empty part of each texel and
       leaves the paint already there untouched. */
    else if (this.cur.under) gl.blendFunc(gl.ONE_MINUS_DST_ALPHA, gl.ONE);
    else gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(P.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.stroke);
    gl.uniform1i(P.u.uStroke, 0);
    gl.uniform3fv(P.u.uColour, this.cur.colour);
    gl.uniform1f(P.u.uOpacity, this.cur.opacity);
    gl.uniform1f(P.u.uStrokeIsPhoto, this.cur.isPhoto ? 1 : 0);
    gl.uniform1f(P.u.uAbut, abut ? 1 : 0);
    if (abut) {
      gl.disable(gl.BLEND);                  // the shader does the joining
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, this.paint);
      gl.uniform1i(P.u.uWas, 1);
    }
    gl.bindVertexArray(quadVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
    gl.disable(gl.BLEND);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (abut) {
      const f = fbo(this.disp);
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, f);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, this.fPaint);
      gl.blitFramebuffer(0, 0, this.size, this.size, 0, 0, this.size, this.size,
        gl.COLOR_BUFFER_BIT, gl.NEAREST);
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
      gl.deleteFramebuffer(f);
    }

    this.clearStroke();
    this.dilate();
  }

  dilate() {
    const P = this.pDil;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fDisp);
    gl.viewport(0, 0, this.size, this.size);
    gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
    gl.useProgram(P.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.paint);
    gl.uniform1i(P.u.uPaint, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, this.mask);
    gl.uniform1i(P.u.uMask, 1);
    gl.uniform2f(P.u.uTexel, 1 / this.size, 1 / this.size);
    gl.uniform1f(P.u.uRadius, 6);
    gl.bindVertexArray(quadVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  canUndo() { return this.undoAt >= 0; }
  canRedo() { return this.redoAvail > 0; }
  undo() {
    if (!this.canUndo()) return;
    if (this.redoAvail === 0) this.redoTop = this.snapshot();
    this.restore(this.undoRing[this.undoAt]);
    this.undoAt--; this.redoAvail++;
  }
  redo() {
    if (!this.canRedo()) return;
    this.undoAt++; this.redoAvail--;
    const t = this.redoAvail === 0 ? this.redoTop : this.undoRing[this.undoAt + 1];
    this.restore(t);
  }

  // OBJ measures V from the bottom of the image, glTF from the top. The saved
  // texture has to match the file it will be applied to, or it comes out
  // upside down in whatever the user opens it in.
  async exportPNG(flipV) {

function placePicker(at) {
  // the metallic extension: remove this line to take it out
  const r = at
    ? {left: at[0] - 11, top: at[1] - 11, width: 22, height: 22}
    : swatch.getBoundingClientRect();
  const w = pick.offsetWidth || 230, h = pick.offsetHeight || 300, gap = 10;
  const left = Math.round(Math.min(innerWidth - w - gap,
    Math.max(gap, r.left + r.width/2 - w/2)));

  // above the anchor by preference, below it if there is no room up there
  let bottom = innerHeight - r.top + gap;
  if (bottom + h > innerHeight - gap) bottom = innerHeight - (r.top + r.height) - gap - h;
  bottom = Math.min(innerHeight - h - gap, Math.max(gap, bottom));

  /* Then lift it clear of any bar it would land on. Judging by how far down the
     screen a bar sat missed the toolbar once it wrapped to several rows and
     grew tall - so test the overlap itself, which is the thing that matters. */
  for (let pass = 0; pass < 4; pass++) {
    let pushed = false;
    const top = innerHeight - bottom - h;
    for (const id of ['bar', 'gbar', 'pbar', 'patchWrap']) {

   and give it a single handle, because a whole line that reacts to pointer

  const c = camera(), m = c.viewProj, S = Math.min(devicePixelRatio || 1, 2);
  const pr = (w) => {

 * Which piece is sewn to which, and how their flattenings line up.
 *
 * The atlas says which pieces sit near each other on the sheet; the mesh says
 * which are sewn together, because two triangles sharing a 3D edge while
 * belonging to different pieces are joined at that seam. Matching the points
 * along a seam gives the transform that carries one piece's layout into the
 * other's, so an image running off the front continues onto the back where it
 * really would - not wherever the atlas happened to put the next piece.
 *
 * It does not always work, and that is a fact about garments rather than about
 * the data: a sleeve head and an armhole are sewn together but their flat

 * is poor the seam is marked unusable and the image is cut there instead.

/* Which piece owns each part of the sheet, so the frame knows what it is over. */
function buildIslMap() {
  const PC = pieces || buildPieces();

      const cx2 = U[c*2]*S, cy2 = (1-U[c*2+1])*S;

      const x1 = Math.min(S-1, Math.ceil(Math.max(ax, bx, cx2)));

      const y1 = Math.min(S-1, Math.ceil(Math.max(ay, by, cy2)));

  const key = new Map(), wid = [];

    const U = p.uv, n = U.length/2;

      const k = Math.round(U[i*2]*8192) + ',' + Math.round(U[i*2+1]*8192);
      let id = key.get(k);
      if (id === undefined) key.set(k, id = key.size);

    base += n;
  }
  const par = new Int32Array(key.size);
  for (let i = 0; i < par.length; i++) par[i] = i;
  const find = x => { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };
  base = 0;
  for (const p of mesh.parts) {
    const X = p.index;
    for (let t = 0; t < X.length; t += 3) {
      const a2 = find(wid[base+X[t]]);
      for (const k of [1, 2]) {
        const b2 = find(wid[base+X[t+k]]);
        if (b2 !== a2) par[b2] = a2;

  }

/**
 * How far the model misses being a mirror of itself, in world units.
 *
 * Sampled vertices are reflected and matched to the nearest real vertex
 * through a uniform grid. The 99th percentile becomes the depth tolerance the
 * reflected half is judged by: tighter and an asymmetric model stipples,
 * looser and mirrored paint starts punching through thin parts.
 */
function measureAsymmetry() {
  const tag = mesh.parts.length + ':' + planeX.toFixed(4);
  if (mirrorTolFor === tag) return mirrorTol;
  const pts = [];
  for (const p of mesh.parts)
    for (let i = 0; i < p.position.length; i += 3)
      pts.push(p.position[i], p.position[i+1], p.position[i+2]);

  const cell = Math.max(mesh.radius / 20, 1e-6);
  const grid = new Map();
  const key = (x, y, z) => (Math.floor(x/cell)) + ',' + (Math.floor(y/cell))
                         + ',' + (Math.floor(z/cell));
  for (let i = 0; i < n; i++) {
    const k = key(pts[i*3], pts[i*3+1], pts[i*3+2]);
    let a = grid.get(k);
    if (!a) grid.set(k, a = []);
    a.push(i);
  }
  const step = Math.max(1, Math.floor(n / 1500));
  const out = [];
  for (let i = 0; i < n; i += step) {
    const mx = 2*planeX - pts[i*3], my = pts[i*3+1], mz = pts[i*3+2];
    let best = Infinity;
    for (let r = 1; r <= 4 && !isFinite(best); r++) {
      const cx = Math.floor(mx/cell), cy = Math.floor(my/cell), cz = Math.floor(mz/cell);
      for (let dz = -r; dz <= r; dz++) for (let dy = -r; dy <= r; dy++)
        for (let dx = -r; dx <= r; dx++) {
          const a = grid.get((cx+dx) + ',' + (cy+dy) + ',' + (cz+dz));
          if (!a) continue;
          for (const j of a) {
            const d = (pts[j*3]-mx)**2 + (pts[j*3+1]-my)**2 + (pts[j*3+2]-mz)**2;
            if (d < best) best = d;
          }

    if (isFinite(best)) out.push(Math.sqrt(best));

  out.sort((a, b) => a - b);
  const p99 = out.length ? out[Math.min(out.length-1, Math.floor(out.length*0.99))] : 0;
  mirrorTol = Math.min(p99*1.1, mesh.radius*0.06);

}

/* Lay dabs from a to b, no further apart than step. */
function walkSegment(a, b, step, put) {
  const d = Math.hypot(b[0]-a[0], b[1]-a[1]);
  const n = Math.min(512, Math.max(1, Math.floor(d/Math.max(step, 0.5))));

/* Spread from a seed over a grid, through whatever `open` says is passable.
   Returns the covered cells and the box they sit in. */
function floodFrom(seed, W, H, open) {
  const out = new Uint8Array(W*H);
  const stack = new Int32Array(W*H);
  let top = 0, x0 = W, x1 = 0, y0 = H, y1 = 0;
  stack[top++] = seed; out[seed] = 255;
  while (top > 0) {
    const i = stack[--top], x = i % W, y = (i/W) | 0;
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
    for (let k = 0; k < 4; k++) {
      const nx = x + (k === 0 ? 1 : k === 1 ? -1 : 0);
      const ny = y + (k === 2 ? 1 : k === 3 ? -1 : 0);
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const j = ny*W + nx;
      if (out[j] || !open(j)) continue;
      out[j] = 255; stack[top++] = j;
    }
  }
  return {out, x0, x1, y0, y1};
}

/* Ease the wobble out of pts[from..to], leaving the ends where they are.
   Each pass moves every point toward the midpoint of its neighbours, which
   attenuates by wavelength - a shake goes quickly, the shape drawn on purpose
   survives. */
function easePoints(pts, from, to, passes) {
  if (passes < 1 || to - from < 4) return;
  const n = to - from + 1;
  let cur = new Float64Array(n*2), nxt = new Float64Array(n*2);
  for (let i = 0; i < n; i++) {
    cur[i*2] = pts[from+i][0];
    cur[i*2+1] = pts[from+i][1];
  }
  for (let k = 0; k < passes; k++) {
    nxt[0] = cur[0]; nxt[1] = cur[1];
    nxt[(n-1)*2] = cur[(n-1)*2]; nxt[(n-1)*2+1] = cur[(n-1)*2+1];
    for (let i = 1; i < n-1; i++)
      for (let j = 0; j < 2; j++) {
        const v = cur[i*2+j];
        nxt[i*2+j] = v + 0.5*((cur[(i-1)*2+j] + cur[(i+1)*2+j])/2 - v);
      }
    const t = cur; cur = nxt; nxt = t;
  }
  for (let i = 1; i < n-1; i++) {
    pts[from+i][0] = cur[i*2];
    pts[from+i][1] = cur[i*2+1];
  }
}

/* ---- an alternative fill, kept apart so it can be taken out ---------------
   Everything this needs is in this block, plus one switch in the toolbar and
   one `if` at each of the two places a fill is worked out. Deleting those three
   things removes it and leaves nothing behind.

   It works the way the ordinary fill does not: instead of spreading through a
   stroke's soft edge and blending, it first decides for every cell whether it
   is more than half covered, which gives a hard-edged picture with no soft
   cells at all. The region is flooded in that, and the boundary is smoothed
   afterwards. The region can never run away, because the decision is made once
   per cell rather than by walking. */
/* The fill was rewritten: it hardens a working copy to decide where to stop,
   floods that, writes the colour in, and softens the join on both sides. The
   earlier one - which climbed a stroke's soft edge in screen space - is still
   here and can be switched back on by setting this to true. */
const OLD_FILL = false;

/* ---- end of the alternative fill ---------------------------------------- */

/* One stroke, wherever it is being drawn.
   It holds the points, spaces the dabs, counts the half-seconds of stillness
   and eases the wobble out - and knows nothing about what it is drawing on.
   The garment hands it dabs that go through the painter; the shape pad hands
   it dabs that are circles on a canvas. Line and fill hang off the same
   dispatch, so neither target can quietly be missing one. */
/* A straight line, laid the same way whether it is being previewed or kept.
   Drawing it one way for the preview and another for the commit left a dab at
   the head that had not been shown. */
function layLine(a, b, step, put) {
  put(a);
  walkSegment(a, b, step, put);
}

function makeStroker(t) {
  let pts = null, from = 0, since = 0, still = null, eased = false;
  let lineFrom2 = null, lineTo = null;
  const show = () => t.redraw(lineFrom2 ? {line: [lineFrom2, lineTo]} : {pts});
  return {
    get drawing() { return !!(pts || lineFrom2); },
    get points() { return pts; },
    begin(p, pressure) {
      // A target can say it handles line and fill itself. The garment routes
      // both before a stroke is ever begun, and running them here as well
      // meant a doubled fill and a line that no one ever finished.
      // Each target says which tool it is on. The pad has its own row of them,
      // so choosing Line on the toolbar no longer changes what the pad does.
      /* Erasing is a brush, always. Left as a flag over whichever tool was in
         hand it erased by flooding or by drawing a line. */
      const tl = (t.erasing && t.erasing()) ? 'brush'
        : (t.tool ? t.tool() : tool);
      if (!t.ownTools) {
        if (tl === 'fill') { t.fill(p); return; }
        if (tl === 'line') { lineFrom2 = p; lineTo = p; show(); return; }
      }
      pts = [p]; from = 0; still = null; eased = false;
      t.dab(p, pressure);
      // A target that lays dabs as they are made has nothing to redraw yet, and
      // redrawing would wipe the buffer the stroke was just set up in.
      if (!t.live) show();
    },
    move(p, pressure) {
      if (lineFrom2) { lineTo = p; show(); return; }
      if (!pts) return;
      const n = walkSegment(pts[pts.length-1], p, t.step, q => {
        pts.push(q);
        if (t.live) t.dab(q, pressure);
      });
      if (n > 0 && !t.live) show();
      const sm = t.smooth ? t.smooth() : smoothAmt;
      if (sm && (!still || Math.hypot(p[0]-still[0], p[1]-still[1]) > t.jitter)) {
        // the piece being eased only moves on once something has been eased
        if (eased) { from = pts.length - 1; eased = false; }
        still = p;
        since = performance.now();
      }
    },
    end(pressure) {
      if (lineFrom2 && lineTo)
        layLine(lineFrom2, lineTo, t.step, q => t.dab(q, pressure));
      // hand the points over before letting go of them: reading them back
      // through the getter afterwards found nothing, and the stroke was lost
      const finished = pts;
      const had = pts || lineFrom2;
      pts = null; lineFrom2 = null; lineTo = null; still = null;
      if (had) t.done(finished);
    },
    /* Called every frame: fills the ring, and eases when it is full. */
    tick() {
      const sm = t.smooth ? t.smooth() : smoothAmt;
      if (!still || !sm || !pts) return;
      const f = Math.min(1, (performance.now() - since)/DWELL_MS);
      if (f >= 1) {
        easePoints(pts, from, pts.length - 1,
          Math.round(sm*sm*sm*300));
        eased = true;
        since = performance.now();
        t.redraw({pts});
      }
      t.ring(still, Math.min(1, (performance.now() - since)/DWELL_MS));
    },
    cancel() { pts = null; lineFrom2 = null; lineTo = null; still = null; },
  };
}

function stampAt(p, pressure) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  painter.stamp(p[0], p[1], Math.max(0.6, radius * dpr * (0.35 + 0.65 * pressure)),
    hardness, 1.0, {mirror});
}
function stopStroke() {
  if (modelStroke) modelStroke.end(1);
  modelStroke = null;
  dwellRing = null;
  document.getElementById('dwell').style.visibility = 'hidden';
  if (!painting) return;
  painting = false;
  painter.endStroke();
  refreshUndo();
  dirty = true;
}

cv.addEventListener('pointerdown', e => {
  if (penDown && e.pointerType === 'touch') return;   // palm rejection
  cv.setPointerCapture(e.pointerId);

  let role;
  if (pts.size >= 1) {
    // a second finger arrives: abandon any stroke and become a pinch pair
    stopStroke();
    for (const q of pts.values()) q.role = 'pinch';
    role = 'pinch';
    pinch = 0;
  } else if (e.pointerType === 'mouse' && (e.button === 2 || e.button === 1)) {
    role = 'orbit';                       // right button always rotates
  } else if (maskShape) {
    const r0 = cv.getBoundingClientRect();
    const x = e.clientX - r0.left, y = e.clientY - r0.top;
    if (!maskShape.placed) {
      /* Only the overlay is redrawn. Recomputing the gradient here restricted
         it to whatever was kept - nothing, at this point - so the background
         gradient vanished the instant a shape was dropped on it. */
      maskShape.cx = x; maskShape.cy = y; maskShape.placed = true;
      drawGrad();
      dirty = true;
      return;
    }
    /* The part is carried on the entry made for this pointer, which is set
       below - reaching for it here found nothing, since it does not exist yet. */
    maskPart = framePart(maskShape, x, y);
    role = maskPart ? 'mshape' : 'orbit';
  } else if (stampSrc && !photo) {
    // a shape is chosen and waiting: this press decides where it goes
    const r0 = cv.getBoundingClientRect();
    if (dropStampFrame(e.clientX - r0.left, e.clientY - r0.top)) return;
    role = 'orbit';
  } else if (grad && !gmaskArmed &&
             gradPart(e.clientX - cv.getBoundingClientRect().left,
                      e.clientY - cv.getBoundingClientRect().top)) {
    const r0 = cv.getBoundingClientRect();
    const part = gradPart(e.clientX - r0.left, e.clientY - r0.top);
    if (part.line) {
      // clicking the line itself drops a new stop where it was clicked
      grad.stops.push({t: part.t, rgb: colour.slice(), flow: 1});
      drawGrad(); applyGradient();
      return;
    }
    role = 'grad';
    pts.set(e.pointerId, {role, stop: part.stop, moved: false});
  } else if (grad && gmaskArmed) {
    role = 'gmask';
    const r0 = cv.getBoundingClientRect();
    const k = maskScale();
    gmaskPts = [[(e.clientX - r0.left)/cv.clientWidth*k,
                 (e.clientY - r0.top)/cv.clientHeight*k]];
    pts.set(e.pointerId, {role});
  } else if (photo) {
    const r0 = cv.getBoundingClientRect();
    const part = photo ? framePart(photo, e.clientX - r0.left, e.clientY - r0.top) : null;
    // the placement follows what the frame is over, so the view holds still
    if (!part) { dirty = true; return; }
    role = 'photo';
    pts.set(e.pointerId, {role, part});
  } else if (nearHandle(e.clientX, e.clientY)) {
    role = 'mirror';
  } else {
    role = mode === 'paint' ? 'paint' : 'pan';
  }

  // Pressing on the background and dragging turns the model, rather than
  // starting a stroke that has nothing to land on.
  if (role === 'paint') {
    const r0 = cv.getBoundingClientRect();
    if (!overModel(e.clientX - r0.left, e.clientY - r0.top)) role = 'orbit';
  }

  // Keep whatever the branch above recorded. Listing the fields by hand meant
  // a new one was silently dropped, and the release then had nothing to act on.
  const prev = pts.get(e.pointerId) || {};
  /* The part a press landed on belongs to the branch that worked it out. Set
     here for every role, it overwrote the one the photo branch had just
     stored - and a photo was then dragged with nothing to drag by. */
  pts.set(e.pointerId, {...prev, x: e.clientX, y: e.clientY, role,
                        ...(role === 'mshape' ? {part: maskPart} : {}),
                        t: e.pointerType});
  if (role === 'photo') { dirty = true; return; }
  if (role === 'paint') {
    if (e.pointerType === 'pen') penDown = true;
    lastPt = local(e);
    /* Erasing is a brush whatever tool is in hand, so it never takes the line
       or the fill route. */
    if (tool === 'line' && !erase) {
      lineFrom = lastPt;                  // committed on release
      showGuide(e, e);
    } else if (tool === 'fill' && !OLD_FILL && !erase) {
      /* the alternative fill: remove this branch to take it out.
         Step one: harden every edge. Step two: fill, which is the ordinary
         fill run over a picture that now has no part-covered texels - so its
         judgement about edges has nothing left to get wrong. */
      /* Begun and closed, not cancelled: cancelling takes the state back off
         the undo ring, so a step back skipped over this and went to before the
         lines were drawn. */
      painter.beginStroke(camera(), colour, strokeFlow(), erase);
      painter.endStroke();
      painter.mirrored = mirror;
      painter.fillHardAt(lastPt[0], lastPt[1]);
      refreshUndo();
      dirty = true;
    } else if (tool === 'fill' && !erase) {
      // the earlier fill, kept but switched off - see OLD_FILL
